{id:"f14",cat:"Sensors",lvl:2,type:"num",circ:"bridge",q:"This Wheatstone bridge runs from 5 V. One arm, a strain gauge, has shifted to 1.1 kΩ. What's the differential voltage between the two midpoints?",ans:119,unit:"mV",tol:0.04,
 ex:"Left: 2.500 V. Right: 5 × 1.1/2.1 = 2.619 V. Difference ≈ <b>119 mV</b>.",key:"Bridge output = difference of two dividers.",
 steps:[S("A Wheatstone bridge is two dividers side by side, fed from the same supply. Its output is the difference between their midpoints.",{hl:[2,3,4,5]}),
  S("Left divider: 1k over 1k gives 5 × ½ = 2.500 V.",{hl:[2,3],v:1}),
  S("Right divider: 1k over 1.1k gives 5 × 1.1/2.1 = 2.619 V. Difference = 0.119 V = 119 mV.",{hl:[4,5],v:1})],
 try:[{ask:"Set the 1.1 kΩ back to 1 kΩ. The difference becomes…",ch:["0 mV (balanced)","119 mV","2.5 V"],a:0,set:[[5,"v",1000]],then:"Both midpoints sit at 2.5 V: the bridge is balanced. Any change in the gauge now shows up as a voltage away from zero."},
  {ask:"Now set it to 1.01 kΩ, a 1% change. The output is roughly…",ch:["12 mV","119 mV","1.2 mV"],a:0,set:[[5,"v",1010]],then:"About 12.4 mV. Small, but measured from zero rather than as a tiny wiggle on 2.5 V. An instrumentation amp then amplifies it."}]},
{id:"f15",cat:"Sensors",lvl:2,type:"mc",circ:"bridge",q:"Why are resistive sensors (strain gauges, RTDs) usually read with a Wheatstone bridge instead of measuring their resistance directly?",
 ch:["The output is near zero at balance, so tiny resistance changes become a measurable differential voltage","It increases the sensor's resistance change","It removes the need for an excitation voltage","It converts resistance into frequency"],a:0,
 why:[null,"The bridge doesn't change the sensor at all. It changes how you read it.","A bridge still needs excitation: it's powered by the supply.","That's a different technique (an oscillator). A bridge outputs a voltage."],
 ex:"The bridge subtracts the big common part, leaving only the change. It's also ratiometric.",key:"Bridges turn small ΔR into a clean differential signal.",
 steps:[S("A strain gauge changes resistance by a fraction of a percent. Measured directly, that's a tiny change on top of a big value."),
  S("In the bridge, each midpoint is about 2.5 V. Subtracting them cancels the common 2.5 V and leaves only the change.",{hl:[2,3,4,5],v:1}),
  S("It's also ratiometric: if the 5 V supply drifts, both midpoints move together. Use the same supply as the ADC reference and the drift cancels.")],
 try:[{ask:"Drop the supply from 5 V to 4 V. The output difference…",ch:["scales down 20%, but stays a clean difference","becomes huge","stays exactly 119 mV"],a:0,set:[[0,"v",4]],then:"It becomes about 95 mV: it scales with the excitation. If the ADC reference tracks the same supply, the reading in counts doesn't change."}]},
// ---------- Diodes ----------
{id:"d1",cat:"Diodes",lvl:1,type:"mc",circ:"diodeDir",q:"What is the basic job of a diode?",
 ch:["Let current flow one way (anode → cathode) and block it the other way","Store charge","Hold current at a fixed value","Step up a voltage"],a:0,
 why:[null,"Storing charge is a capacitor's job.","A diode passes whatever the rest of the circuit allows when it's forward biased. Limiting current is a resistor's or regulator's job.","A diode can't add energy. Stepping up needs a transformer or a boost converter."],
 ex:"Forward biased it conducts; reverse biased it blocks.",key:"Diode = one-way valve for current.",
 steps:[S("The diode symbol is an arrow: current flows the way it points (anode → cathode), and the bar is a wall for the other direction.",{hl:[3,5]}),
  S("Left LED: the arrow points down, with + above it. It's forward biased, so current flows and it lights.",{hl:[3],sel:3}),
  S("Right LED: the arrow points up, against the push from the battery. It's reverse biased: no current, no light, and the whole 5 V sits across it.",{hl:[5],v:1,sel:5})],
 try:[{ask:"Flip the battery. Which LED lights?",ch:["The right one","The left one","Both","Neither"],a:0,set:[["flip",0],["sel",5]],then:"Now the right LED's arrow points with the current. A diode only cares which of its two ends is more positive."}]},
{id:"d2",cat:"Diodes",lvl:1,type:"mc",circ:"diodes3",plot:"diodeIV",q:"Typical forward voltage of a silicon PN diode at moderate current?",
 ch:["About 0.6–0.7 V","About 0.2–0.3 V","About 1.8–2 V","About 5 V"],a:0,
 why:[null,"That's a Schottky diode (metal–semiconductor junction). A silicon PN junction needs more.","That's a red LED, made from a wider-bandgap material.","Diodes drop well under a volt, LEDs a few volts. 5 V would be a breakdown voltage or a string of LEDs."],
 ex:"Silicon PN ≈ 0.65 V, Schottky ≈ 0.3 V, red LED ≈ 1.9 V.",key:"Si ≈ 0.7 V, Schottky ≈ 0.3 V, red LED ≈ 2 V.",
 steps:[S("A diode barely conducts until its voltage reaches a 'knee', then the current rises steeply. That knee is the forward voltage.",{p:1}),
  S("The knee depends on the material: Schottky ≈ 0.3 V, silicon ≈ 0.65 V, red LED ≈ 1.9 V. Each branch here has 1 kΩ in series. Tap each diode.",{hl:[3,5,7],p:2,sel:3}),
  S("Because the curve is so steep, the drop barely changes with current: 10× more current adds only about 60 mV on silicon. That's why '0.7 V' works as a rule of thumb.",{p:2})],
 try:[{ask:"Cut the resistors to 330 Ω, tripling the current. The silicon diode's drop will…",ch:["rise slightly, by tens of mV","triple","stay exactly the same"],a:0,set:[[2,"v",330],[4,"v",330],[6,"v",330],["sel",3]],then:"It rises about 30 mV. The current tripled but the voltage barely moved: that's the exponential curve."}]},
{id:"d3",cat:"Diodes",lvl:1,type:"num",circ:"led",q:"A red LED (Vf ≈ 2.0 V) runs from 5 V. What series resistor gives 10 mA?",ans:300,unit:"Ω",
 ex:"R = (5 − 2) / 0.01 = <b>300 Ω</b>. The nearest standard value up is 330 Ω.",key:"R = (V_supply − V_f) / I_LED",
 steps:[S("The resistor and LED are in series: same current, and their voltages add up to the supply (KVL).",{hl:[2,4]}),
  S("The LED takes its ~2 V forward voltage. The resistor takes the rest: 5 − 2 = 3 V.",{hl:[2],v:1,sel:2}),
  S("Choose R so that 3 V gives 10 mA: R = 3 ÷ 0.01 = 300 Ω.",{hl:[2],sel:2})],
 try:[{ask:"Change the resistor to 100 Ω. The LED current will be about…",ch:["30 mA, too much for many LEDs","10 mA","100 mA"],a:0,set:[[2,"v",100],["sel",4]],then:"About 29 mA. The LED's voltage only rises a little, so nearly all the extra goes to the smaller resistor, giving much more current. Typical indicator LEDs max out around 20 mA."},
  {ask:"Now set it to 1 kΩ. The LED will…",ch:["get dimmer, about 3 mA","stay at 10 mA","go out completely"],a:0,set:[[2,"v",1000],["sel",4]],then:"About 3 mA: (5 − 1.95) ÷ 1000. Still lit, just dimmer. LEDs are often run at 1–5 mA to save power."}]},
{id:"d4",cat:"Diodes",lvl:2,type:"mc",circ:"flyback",q:"Why is a diode placed across a relay coil (in parallel, reverse-biased)?",
 ch:["To clamp the voltage spike when the coil is switched off","To make the relay turn on faster","To protect against reverse supply polarity only","To reduce the coil's holding current"],a:0,
 why:[null,"The diode doesn't conduct at turn-on (it's reverse biased), so it can't speed it up. If anything it slows the release a little.","A series diode could block reverse polarity. This one sits across the coil and only acts at turn-off.","The holding current is set by the coil's resistance. The diode carries nothing while the coil is powered."],
 ex:"Switching off a coil makes a huge spike (V = L·di/dt). The diode gives the current a safe loop to decay through.",key:"Inductive load + switch → add a flyback diode.",
 steps:[S("An inductor stores energy in its magnetic field and resists any change in its current: V = L × di/dt. A sudden stop means a huge di/dt."),
  S("The coil is the 1 H inductor plus its 100 Ω winding resistance. With the switch closed, 120 mA flows through it. The diode is reverse biased (its cathode is at +12 V) and does nothing.",{hl:[2,3,8],sel:2}),
  S("When the switch opens, the coil keeps pushing its 120 mA. The diode gives it a loop: coil → diode → back into the coil, where it fades to zero. The bottom node only rises to about 12.7 V.",{hl:[2,3,8,9,7]})],
 try:[{ask:"Open the switch. Where does the coil's current go right after?",ch:["Around through the diode","Nowhere, it stops instantly","Back into the battery through the switch"],a:0,set:[[4,"v",0],["sel",8]],then:"Watch the dots circle through the diode while the current fades. The switch never sees more than about 13 V."},
  {ask:"Now close the switch, delete the diode, and open the switch again. What happens at the switch?",ch:["The voltage spikes to an absurd level","Nothing changes","The current reverses"],a:0,set:[[4,"v",1],["del",8],["wait",1.5],[4,"v",0]],then:"With nowhere for the current to go, the voltage across the open switch shoots up (see the warning). In hardware, that spike arcs the contacts or punches through the transistor driving the relay."}]},
{id:"d5",cat:"Diodes",lvl:2,type:"mc",circ:"zener",plot:"diodeIV",q:"A Zener diode is normally operated:",
 ch:["In reverse breakdown, holding a near-constant voltage","Forward biased, as a rectifier","Forward biased, as a light source","Reverse biased below breakdown, as a capacitor"],a:0,
 why:[null,"Forward biased, a Zener acts like any diode (~0.7 V). Its useful trick happens in reverse.","LEDs make light. A Zener is built for a sharp, stable reverse breakdown.","Below breakdown it's just a blocking diode. The useful region is the breakdown itself."],
 ex:"A Zener is built to break down at a precise reverse voltage and survive it, so it holds that voltage.",key:"Zener = reverse-breakdown voltage clamp.",
 steps:[S("A normal diode can be damaged by reverse breakdown. A Zener is built to break down at a precise voltage and survive it.",{p:3}),
  S("In breakdown, the current can change a lot while the voltage barely moves, so the Zener holds its node near 5.1 V.",{hl:[4],v:1,sel:4,p:3}),
  S("The series resistor drops the difference (12 − 5.1 = 6.9 V) and sets the current. The Zener absorbs whatever the load doesn't take.",{hl:[2,4,5],sel:2,p:3})],
 try:[{ask:"Raise the battery from 12 V to 15 V. The load voltage will…",ch:["stay near 5.1 V","rise to about 6.4 V","rise to 15 V"],a:0,set:[[0,"v",15],["sel",5]],then:"It stays near 5.1 V. The extra 3 V lands on the 1 kΩ, and the extra current goes into the Zener."},
  {ask:"Now make the load much heavier: change it to 500 Ω. The load voltage…",ch:["drops below 5.1 V","stays at 5.1 V"],a:0,set:[[5,"v",500],["sel",5]],then:"The load wants 10 mA but the resistor can only supply about 10 mA in total. Once the Zener's share hits zero it stops regulating and the output sags (here to 5 V). Size the resistor for the heaviest load."}]},
{id:"d6",cat:"Diodes",lvl:2,type:"mc",circ:"bridgeRect",plot:"ripple",q:"A full-wave bridge rectifier runs from 60 Hz mains. What's the ripple frequency on the smoothing capacitor?",
 ch:["120 Hz","60 Hz","30 Hz","180 Hz"],a:0,
 why:[null,"60 Hz is the half-wave case: one peak per cycle.","Rectifying can't slow the waveform down.","180 Hz would need three-phase mains."],
 ex:"Full-wave flips the negative half-cycles positive: two peaks per cycle, so <b>120 Hz</b>.",key:"Full-wave ripple = 2 × line frequency.",
 steps:[S("A bridge rectifier routes both halves of the sine wave into the load in the same direction.",{hl:[3,4,5,6]}),
  S("Positive half: current flows through the top-right and bottom-left diodes. Negative half: through the other two. Either way the load gets a positive bump.",{hl:[3,6],sel:3}),
  S("Two bumps per input cycle means the capacitor is topped up twice per cycle: 2 × 60 Hz = 120 Hz ripple.",{sel:11})],
 try:[{ask:"Delete the capacitor. The load voltage will look like…",ch:["a chain of positive bumps, two per cycle","a flat DC line","a normal sine wave"],a:0,set:[["del",9],["sel",11]],then:"That's raw full-wave output: every half-cycle flipped positive. The capacitor's job is to fill the gaps."}]},
{id:"d7",cat:"Diodes",lvl:2,type:"mc",circ:"bridgeRect",q:"In a full-wave bridge rectifier, how many diode drops are in the current path during each half-cycle?",
 ch:["Two","One","Four","None"],a:0,
 why:[null,"One drop is a center-tapped full-wave or a half-wave rectifier. A bridge always has two diodes in the path.","All four never conduct at once. That would short the source.","Every conducting path goes through diodes."],
 ex:"Out through one diode, back through another: about 1.4 V lost.",key:"Bridge: 2 diode drops (~1.4 V).",
 steps:[S("Follow the current in the positive half: out of the source's top, through a diode to the load's + side, through the load, then back through a second diode to the source's bottom.",{hl:[3,6,11]}),
  S("Two diodes in the path means two drops, about 1.4 V. With a 10 V peak, the load peaks near 8.6 V.",{hl:[11],sel:11}),
  S("At 5 V or less, 1.4 V is a big fraction. That's why low-voltage supplies use Schottky or MOSFET (synchronous) rectifiers.")],
 try:[{ask:"Lower the AC amplitude to 2 V. The load's peak will be about…",ch:["1.3 V: about a third is lost in the diodes","2 V: nothing is lost","0 V: the diodes block it"],a:0,set:[[0,"v",2],["sel",11]],then:"About 1.3 V. At this tiny current each diode drops only about 0.35 V (more like 0.7 V at real load currents), but two of them still eat a third of a 2 V input. At low voltages diode drops dominate."}]},
{id:"d8",cat:"Diodes",lvl:1,type:"mc",circ:"reverse",q:"A diode is reverse biased below its breakdown voltage. To a first approximation it behaves like:",
 ch:["An open circuit (tiny leakage plus a little capacitance)","A short circuit","A 0.7 V battery","A small resistor"],a:0,
 why:[null,"Reverse biased, it blocks. A short only happens after breakdown or failure.","0.7 V is the forward drop. In reverse it can hold back the whole supply.","It doesn't act like a small resistor: almost no current flows."],
 ex:"Reverse biased, only a tiny leakage current flows.",key:"Reverse biased ≈ open circuit.",
 steps:[S("The diode's cathode (the bar) faces the + side of the battery, so it's reverse biased.",{hl:[4]}),
  S("Tap the diode: nearly the whole 5 V is across it and the current is tiny. The resistor drops almost nothing because almost nothing flows.",{hl:[4,2],v:1,sel:4}),
  S("Real diodes leak a little more (nA to µA, more when hot) and have a small capacitance, which matters at high frequencies.")],
 try:[{ask:"Flip the diode. The current will be about…",ch:["4.3 mA","5 mA","0 mA"],a:0,set:[["flip",4],["sel",4]],then:"Now forward biased: (5 − 0.7) ÷ 1 kΩ ≈ 4.3 mA."}]},
{id:"d9",cat:"Diodes",lvl:2,type:"mc",circ:"rectifier",q:"In this half-wave rectifier, what is the capacitor doing?",
 ch:["Holding the output up while the diode is off, smoothing the voltage","Blocking DC from the load","Setting the AC frequency","Limiting the diode's current"],a:0,
 why:[null,"Blocking DC is what a capacitor in <i>series</i> does. This one is across the output, so it holds voltage instead.","The AC source sets the frequency; nothing in this circuit can change it.","The diode current is set by how much charge the capacitor needs at each peak. The capacitor actually increases the peak current."],
 ex:"The capacitor recharges at each peak and feeds the load in between.",key:"Reservoir cap: charges at peaks, feeds the load between.",
 steps:[S("The diode only conducts when the input is above the output by ~0.7 V. That happens briefly near each positive peak.",{hl:[2],sel:2}),
  S("At each peak, a burst of current goes through the diode and refills the capacitor. Watch the diode's current trace: short pulses.",{hl:[2,4],sel:2}),
  S("Between peaks the diode is off. The capacitor supplies the load and its voltage droops. That droop is the ripple.",{hl:[4,5],sel:5})],
 try:[{ask:"Change the capacitor from 220 µF to 22 µF. The ripple will…",ch:["get much bigger","get smaller","stay the same"],a:0,set:[[4,"v",22e-6],["sel",5]],then:"With less stored charge, the voltage falls further between peaks. Ripple ≈ I ÷ (f × C), so 10× less C gives roughly 10× the ripple."}]},
// ---------- Transistors ----------
{id:"t1",cat:"Transistors",lvl:1,type:"mc",circ:"bjt",q:"Which best describes how a BJT and a MOSFET are controlled?",
 ch:["BJT: base current controls collector current. MOSFET: gate voltage controls drain current.","Both are controlled by gate/base current","BJT: base voltage with no current. MOSFET: gate current.","Both are controlled by the load voltage"],a:0,
 why:[null,"A MOSFET's gate is insulated, so no DC gate current flows.","A BJT's base is a forward-biased junction: current flows into it. And a MOSFET's gate draws none.","The load sets how much current is <i>possible</i>; the transistor is controlled from its base or gate."],
 ex:"BJT: I_C ≈ β·I_B. MOSFET: insulated gate, controlled by V_GS.",key:"BJT = current-controlled, MOSFET = voltage-controlled.",
 steps:[S("In this BJT circuit, a small current flows into the base through 100 kΩ: about 50 µA.",{hl:[2,3],sel:3}),
  S("That base current allows a collector current β times larger: about 5 mA. Tap the transistor to see I_B and I_C.",{hl:[3,4],sel:3}),
  S("A MOSFET is different: its gate is insulated, like a capacitor plate. What matters is the gate-to-source voltage, and the DC gate current is zero.")],
 try:[{ask:"Halve the base current by changing R_B to 200 kΩ. The collector current will…",ch:["roughly halve","stay the same","double"],a:0,set:[[2,"v",200000],["sel",3]],then:"I_C drops to about 2.5 mA. In the active region, collector current follows base current."}]},
{id:"t2",cat:"Transistors",lvl:1,type:"num",circ:"bjt",q:"A BJT with β = 100 has 50 µA of base current and is in the active region. What's the collector current?",ans:5,unit:"mA",
 ex:"I_C = β · I_B = 100 × 50 µA = <b>5 mA</b>.",key:"Active region: I_C = β·I_B",
 steps:[S("In the active region a BJT acts like a current amplifier: I_C = β × I_B.",{hl:[3],sel:3}),
  S("I_C = 100 × 50 µA = 5,000 µA = 5 mA."),
  S("Check it really is active: the 1 kΩ drops 5 V, leaving V_CE = 12 − 5 = 7 V, well above ~0.2 V. Not saturated.",{hl:[4,3],v:1,sel:3})],
 try:[{ask:"Change R_B to 10 kΩ. That's about 500 µA of base current, so β × I_B = 50 mA. What will I_C actually be?",ch:["About 12 mA: R_C limits it and the transistor saturates","50 mA","5 mA"],a:0,set:[[2,"v",10000],["sel",3]],then:"12 V across 1 kΩ allows at most 12 mA. The transistor saturates: V_CE falls to about 0.1 V and I_C is far less than β·I_B. The inspector shows 'saturation'."}]},
{id:"t3",cat:"Transistors",lvl:2,type:"mc",circ:"nmosHigh",q:"To switch a 12 V load with an N-channel MOSFET driven from a 3.3 V microcontroller, the simplest arrangement is:",
 ch:["Low-side: source to ground, load between +12 V and the drain","High-side: drain to +12 V, load between source and ground","Load between gate and ground","Source to +12 V, load on the drain"],a:0,
 why:[null,"That's this circuit, and it fails: the source rises with the load and eats into V_GS. The load only gets about 1 V.","The gate draws no current, so a load there would never be switched.","With the source at +12 V, a 3.3 V gate is far <i>below</i> the source. V_GS is negative and the FET stays off."],
 ex:"V_GS is measured from the source. Low-side, the source sits at 0 V, so 3.3 V on the gate means V_GS = 3.3 V.",key:"N-FET low-side; P-FET (or a driver) high-side.",
 steps:[S("A MOSFET responds to V_GS: the gate voltage measured from its own source pin, not from ground."),
  S("This circuit is the high-side mistake. The source connects to the load, so as the FET turns on the source rises and V_GS shrinks. It settles near 1 V, leaving the load with only ~1 V of 12.",{hl:[2,6],v:1,sel:2}),
  S("The fix is low-side: load above the drain, source at ground. Then V_GS = 3.3 V no matter what the load does.")],
 try:[{ask:"Raise the gate drive to 15 V. The load voltage will…",ch:["climb toward 12 V","stay near 1 V","go negative"],a:0,set:[[0,"v",15],["sel",6]],then:"Now the gate can sit far enough above the source. High-side N-channel switches need a gate voltage above the supply, which is what bootstrap gate drivers produce."}]},
{id:"t4",cat:"Transistors",lvl:2,type:"mc",circ:"nmosLow",q:"Why put a resistor (e.g. 100 kΩ) from a MOSFET's gate to its source?",
 ch:["So the gate can't float and turn the FET on when the driver is off or unpowered","To speed up switching","To limit drain current","To bias the body diode"],a:0,
 why:[null,"Speed is set by how fast you can charge the gate. A gate-to-source resistor bleeds it, which doesn't help.","Drain current is set by the load and V_GS, not by a gate resistor.","The body diode is internal and needs no bias."],
 ex:"The gate is a capacitor. Without a pull-down, it can hold or pick up charge and leave the FET on.",key:"Never let a MOSFET gate float.",
 steps:[S("A MOSFET gate is a small capacitor. Once charged, it holds the charge, and the FET stays on, even if nothing is driving it.",{hl:[3]}),
  S("The 100 kΩ pull-down gives that charge a way out. When the MCU pin lets go, the gate falls to 0 V and the FET turns off.",{hl:[8]}),
  S("Without it, during reset or boot (when MCU pins float), stray charge can leave the load half on or fully on.")],
 try:[{ask:"Open the 'pin' switch (the MCU pin goes high-impedance). With the pull-down in place, the load will…",ch:["turn off","stay on"],a:0,set:[[1,"v",0],["sel",3]],then:"The gate discharges through the 100 kΩ in microseconds and the load turns off."},
  {ask:"Now close the pin switch, delete the pull-down, then open the pin switch again. The load…",ch:["stays on: the gate keeps its charge","turns off"],a:0,set:[[1,"v",1],["del",8],["wait",0.4],[1,"v",0],["sel",3]],then:"With nowhere to go, the gate charge stays put and the FET stays on. Real gates also pick up noise and drift, so the state is unpredictable. That's why the pull-down is standard."}]},
{id:"t5",cat:"Transistors",lvl:1,type:"num",circ:"nmosOn",q:"A MOSFET with Rds(on) = 50 mΩ carries 4 A while fully on. How much power does it dissipate?",ans:0.8,unit:"W",
 ex:"P = I² · R = 16 × 0.05 = <b>0.8 W</b>.",key:"Switch loss when on: P = I²·Rds(on)",
 steps:[S("A fully-on MOSFET acts like a small resistor between drain and source: R_DS(on).",{hl:[3],sel:3}),
  S("Power in a resistor: P = I² × R = 4² × 0.05 = 16 × 0.05 = 0.8 W."),
  S("Tap the transistor: about 4 A and ~0.2 V across it. The 3 Ω load takes about 47 W, so the switch wastes under 2%.",{hl:[3,4],sel:3})],
 try:[{ask:"Drop the gate drive to 3.3 V. The FET's power will…",ch:["go up a lot","go down","stay the same"],a:0,set:[[0,"v",3.3],["sel",3]],then:"At V_GS = 3.3 V this FET can't fully turn on. It limits the current (region: saturation), drops over 5 V and burns about 12 W. Gate drive matters as much as the FET."}]},
{id:"t6",cat:"Transistors",lvl:2,type:"mc",circ:"nmosLow",plot:"mosId",q:"A MOSFET datasheet lists Vgs(th) = 2 V. Will a 3.3 V gate drive turn it fully on?",
 ch:["Not necessarily: Vgs(th) is where it barely starts conducting, so check Rds(on) at your gate voltage","Yes, anything above Vgs(th) means fully on","No, it needs exactly 2 V","Only at high temperature"],a:0,
 why:[null,"Threshold is where the FET <i>starts</i> conducting (often defined at 250 µA), nowhere near fully on.","There's nothing special about driving at exactly V_th. You drive well above it.","Temperature shifts the threshold a little but doesn't fix weak gate drive."],
 ex:"Look for an Rds(on) spec at your V_GS. Parts rated at 2.5 V or 4.5 V are 'logic-level'.",key:"Use Rds(on) @ your V_GS, not Vgs(th).",
 steps:[S("The threshold voltage is where the FET just starts to conduct. Datasheets define it at a tiny current like 250 µA.",{p:1}),
  S("To act like a closed switch, the gate has to be well above threshold. R_DS(on) keeps falling as V_GS rises.",{p:2}),
  S("This circuit drives a 2 A load from a 3.3 V gate. Tap the transistor: V_DS ≈ 0.85 V and about 1.6 W of heat, versus 0.1 V and 0.2 W with a 10 V gate.",{hl:[3],sel:3,p:2})],
 try:[{ask:"Change the gate drive (the MCU source) to 10 V. V_DS will…",ch:["drop to about 0.1 V","stay about the same","rise"],a:0,set:[[0,"v",10],["sel",3]],then:"With 8 V above threshold the channel is wide open. For 3.3 V logic, pick a logic-level FET whose R_DS(on) is specified at V_GS = 2.5 V or 3.3 V."}]},
{id:"t7",cat:"Transistors",lvl:2,type:"mc",circ:"bjt",q:"When a BJT used as a switch is 'saturated', what's true?",
 ch:["V_CE drops to about 0.1–0.3 V and it acts like a closed switch","Collector current exactly equals β × base current","No base current flows","V_CE equals the supply voltage"],a:0,
 why:[null,"That's only true in the active region. In saturation, I_C is less than β·I_B.","Saturation needs plenty of base current.","That's cutoff (switch open): no collector current, so nothing drops across R_C."],
 ex:"In saturation the load, not the transistor, limits the current.",key:"Saturated BJT ≈ closed switch with ~0.2 V drop.",
 steps:[S("In the active region, I_C = β·I_B. But the collector circuit can only supply so much: here 12 V ÷ 1 kΩ = 12 mA at most.",{hl:[4]}),
  S("Push enough base current that β·I_B exceeds that, and the transistor can't follow. V_CE collapses to ~0.1–0.2 V: it's saturated.",{hl:[3],sel:3}),
  S("When switching, designers aim for I_B ≈ I_C ÷ 10 (a 'forced β' of 10) so it saturates for certain, even though β varies from part to part.")],
 try:[{ask:"Change R_B to 10 kΩ to saturate it. V_CE will drop to about…",ch:["0.1 V","7 V","12 V"],a:0,set:[[2,"v",10000],["sel",3]],then:"V_CE ≈ 0.1 V and I_C ≈ 12 mA, even though β·I_B ≈ 50 mA. The inspector shows 'saturation', and I_C/I_B is far below 100."}]},
// ---------- Op-amps ----------
{id:"o1",cat:"Op-amps",lvl:1,type:"mc",circ:"opInv",q:"With negative feedback, the two 'golden rules' for analyzing an ideal op-amp are:",
 ch:["No current flows into the inputs, and the output does whatever makes V+ equal V−","The output current is zero and V+ = 0","The inputs draw equal current and the output sits at mid-supply","The gain is 1 and the inputs are shorted"],a:0,
 why:[null,"The output has to deliver current. It's the inputs that draw none.","The output moves wherever it's needed; it isn't pinned to mid-supply. And the inputs draw no current.","The gain depends on the resistors. The inputs aren't shorted; feedback just drives them to equal voltages."],
 ex:"No input current; with negative feedback, V+ = V−.",key:"No input current; V+ = V− (with negative feedback).",
 steps:[S("Rule 1: no current flows into the inputs. Rule 2: with negative feedback, the output adjusts until V+ = V−."),
  S("Here V+ is grounded, so the op-amp drives its output until V− is 0 V too. That's a 'virtual ground'. Node voltages are on.",{hl:[3],v:1,sel:3}),
  S("With V− at 0 V, the input current is 0.2 V ÷ 4.7 kΩ = 42.6 µA. None of it goes into the op-amp, so it all flows through R_f: V_out = −42.6 µA × 47 kΩ = −2 V.",{hl:[2,7],sel:7})],
 try:[{ask:"Change V_in to 0.5 V. The voltage at the − input will…",ch:["stay at 0 V","rise to 0.5 V","go to −5 V"],a:0,set:[[0,"v",0.5],["sel",3]],then:"Still 0 V: the output moves to −5 V to keep it there. V− only leaves 0 V when the output hits a rail."}]},
{id:"o2",cat:"Op-amps",lvl:1,type:"num",circ:"opNonInv",q:"Non-inverting amplifier: Rf = 9 kΩ (output to −input), Rg = 1 kΩ (−input to ground). What's the gain?",ans:10,unit:"V/V",
 ex:"G = 1 + Rf/Rg = 1 + 9 = <b>10</b>.",key:"Non-inverting: G = 1 + Rf/Rg",
 steps:[S("The output feeds back to the − input through a divider: R_f over R_g.",{hl:[4,5]}),
  S("Feedback forces V− = V+ = V_in. The divider gives V− = V_out × R_g ÷ (R_f + R_g). Set them equal: V_out = V_in × (1 + R_f/R_g)."),
  S("1 + 9k/1k = 10. With 0.5 V in, the output is 5 V. Tap the op-amp.",{hl:[2],v:1,sel:2})],
 try:[{ask:"Raise V_in to 2 V. The output will be…",ch:["about 12 V, clipped at the rail","20 V","2 V"],a:0,set:[[0,"v",2],["sel",2]],then:"20 V isn't available with ±12 V rails, so the output saturates and V− no longer equals V+. Gain formulas only hold while the output stays inside its supply."}]},
{id:"o3",cat:"Op-amps",lvl:1,type:"num",circ:"opInv",q:"Inverting amplifier: Rin = 4.7 kΩ, Rf = 47 kΩ, Vin = +0.2 V. What is Vout?",ans:-2,unit:"V",
 ex:"G = −Rf/Rin = −10, so Vout = <b>−2 V</b>.",key:"Inverting: G = −Rf/Rin",
 steps:[S("V+ is grounded, so feedback holds V− at 0 V too: a virtual ground.",{hl:[3],v:1}),
  S("The input current is 0.2 V ÷ 4.7 kΩ = 42.6 µA, flowing right through R_in.",{hl:[2],sel:2}),
  S("It can't enter the op-amp, so it carries on through R_f. To pull 42.6 µA through 47 kΩ away from a 0 V node, the output must be at −2 V.",{hl:[7],v:1,sel:3})],
 try:[{ask:"Swap the resistor values (R_in 47 kΩ, R_f 4.7 kΩ). The output becomes…",ch:["−0.02 V","−2 V","+2 V"],a:0,set:[[2,"v",47000],[7,"v",4700],["sel",3]],then:"Gain = −4.7k/47k = −0.1, giving −0.02 V. The gain is just the resistor ratio."}]},
{id:"o4",cat:"Op-amps",lvl:1,type:"mc",circ:"follower",q:"What's the point of a voltage follower (unity-gain buffer)?",
 ch:["Very high input and low output impedance, so a weak source can drive a load without sagging","Doubling the voltage","Inverting the signal","Filtering high frequencies"],a:0,
 why:[null,"A follower's gain is exactly 1.","The output is in phase with the input. Inverting needs the inverting configuration.","There are no filter components in a follower."],
 ex:"Gain is 1, but it isolates the source from the load.",key:"Follower = impedance converter, gain 1.",
 steps:[S("This divider alone has a 5 kΩ Thévenin resistance. Connecting a 1 kΩ load directly would drag it from 5 V to about 0.83 V.",{hl:[2,3]}),
  S("The follower's + input draws no current, so the divider stays at exactly 5 V.",{hl:[7],v:1,sel:7}),
  S("The op-amp output supplies the load current from its own power rails and holds 5 V across the 1 kΩ.",{hl:[12],sel:12})],
 try:[{ask:"Change the load to 100 Ω. The output will…",ch:["stay at 5 V","drop to about 0.1 V","drop to 2.5 V"],a:0,set:[[12,"v",100],["sel",7]],then:"Still 5 V, with 50 mA from the op-amp. A real op-amp would hit its output current limit somewhere around tens of mA."}]},
{id:"o5",cat:"Op-amps",lvl:2,type:"mc",circ:"comparator",q:"An op-amp with no feedback, comparing a signal against a reference, behaves as:",
 ch:["A comparator: the output slams to one rail or the other","A unity-gain amplifier","An integrator","A precise linear amp with gain of 100,000"],a:0,
 why:[null,"Unity gain needs feedback from the output to the − input.","An integrator needs a capacitor in the feedback path.","Without feedback there's nothing to keep it linear: 1 mV × 100,000 = 100 V, far beyond the rails."],
 ex:"Open-loop gain is enormous, so a millivolt of difference saturates the output.",key:"No feedback → comparator; add hysteresis.",
 steps:[S("No feedback means rule 2 doesn't apply: nothing forces V+ = V−. The output is the open-loop gain × (V+ − V−).",{hl:[7],sel:7}),
  S("That gain is about 100,000, so even 1 mV of difference asks for 100 V. The output simply slams to whichever rail it's heading for."),
  S("Here the sensor (3 V) is above the 2.5 V reference, so the output sits at +5 V and the LED is on.",{hl:[9,12],v:1,sel:7})],
 try:[{ask:"Set the sensor to 2.4 V, just below 2.5 V. The output will…",ch:["slam to 0 V","drop slightly to about 4.9 V","sit at 2.4 V"],a:0,set:[[9,"v",2.4],["sel",7]],then:"The output goes to 0 V and the LED turns off. A 100 mV change flipped it rail to rail. Real comparators add hysteresis so noise near 2.5 V doesn't make it chatter."}]},
{id:"o6",cat:"Op-amps",lvl:2,type:"num",plot:"gbw",q:"An op-amp has a gain-bandwidth product of 1 MHz. At a closed-loop gain of 100, what's the approximate bandwidth?",ans:10,unit:"kHz",
 ex:"BW ≈ GBW / gain = 1 MHz / 100 = <b>10 kHz</b>.",key:"Bandwidth ≈ GBW / closed-loop gain",
 steps:[S("An op-amp's open-loop gain is huge at DC but falls 10× for every 10× rise in frequency. Gain × frequency stays constant: that's the GBW.",{p:1}),
  S("Close the loop at a gain of 100 and the amp works fine until its open-loop gain falls to 100. That happens at 1 MHz ÷ 100 = 10 kHz.",{p:2}),
  S("At gain 10 you'd get 100 kHz; at gain 1, the full 1 MHz. Gain and bandwidth trade off, so for high gain at high frequency, split it across two stages.",{p:2})]},
{id:"o7",cat:"Op-amps",lvl:2,type:"mc",circ:"bridge",q:"An instrumentation amplifier is the usual choice for a bridge sensor's output because it has:",
 ch:["High common-mode rejection and high input impedance on both inputs","Very high output current","A gain fixed at exactly 1","No need for a power supply"],a:0,
 why:[null,"Bridge sensors need tiny currents; output current isn't the issue.","In-amps usually have adjustable gain (1 to 1000) set by one resistor.","All amplifiers need power."],
 ex:"It amplifies only the small difference and ignores the big shared level.",key:"Small differential on big common mode → in-amp.",
 steps:[S("The bridge's useful signal is the small difference between the two midpoints: 119 mV here.",{hl:[2,3,4,5],v:1}),
  S("But both midpoints also sit at about 2.5 V. That shared level is the 'common mode', and to the amplifier it's just something to ignore."),
  S("An in-amp amplifies only the difference (high CMRR) and has high impedance on both inputs, so it doesn't load either side of the bridge.")],
 try:[{ask:"Drop the supply to 4 V. The common-mode level changes by 0.5 V. The difference changes by…",ch:["only about 24 mV","0.5 V","nothing at all"],a:0,set:[[0,"v",4]],then:"The difference goes from 119 to about 95 mV while the common mode moved 500 mV. An in-amp with good CMRR passes the 24 mV change and rejects the rest."}]},
{id:"o8",cat:"Op-amps",lvl:1,type:"mc",q:"A 'rail-to-rail output' op-amp on a 0–5 V supply can swing its output:",
 ch:["Close to 0 V and 5 V, within tens of mV depending on load","Exactly to 0 V and 5 V at any load","Beyond the supply rails","Only between about 1.5 V and 3.5 V"],a:0,
 why:[null,"No output stage reaches the rail exactly under load. There's always some drop, and it grows with current.","An op-amp can't produce voltages outside its supply.","That's an older, non-rail-to-rail part, like the LM358 near its top rail."],
 ex:"Even rail-to-rail parts lose some headroom as load current rises.",key:"Rail-to-rail ≈ near the rails, not at them.",
 steps:[S("The output stage is a pair of transistors between the supply rails. Each needs a little voltage across it, more as the load draws more current."),
  S("A rail-to-rail part gets within tens of mV at light load. Datasheets specify V_OH and V_OL at a given load current."),
  S("Practical rule: on a 0–5 V supply, don't design a signal to reach exactly 0 V or 5 V. Leave margin, or use a slightly bigger supply. (The simulator's op-amp is ideal and does reach its rails.)")]},
// ---------- AC & reactive ----------
{id:"a1",cat:"AC & Reactive",lvl:1,type:"num",circ:"rc",plot:"rcCharge",q:"What's the time constant of this circuit: 10 kΩ charging a 100 µF capacitor?",ans:1,unit:"s",
 ex:"τ = R·C = 10,000 × 0.0001 = <b>1 s</b>.",key:"τ = R·C",
 steps:[S("The time constant τ = R × C sets how fast an RC circuit moves. More R means less charging current; more C needs more charge.",{p:2}),
  S("τ = 10,000 Ω × 0.0001 F = 1 s.",{p:3}),
  S("Press Restart below and watch the capacitor's trace: 63% after 1 s, essentially full after 5 s.",{hl:[5],sel:5,p:3})],
 try:[{ask:"Change R to 20 kΩ and restart. Reaching 63% will take…",ch:["2 s","0.5 s","1 s"],a:0,set:[[3,"v",20000],["restart"],["sel",5]],then:"τ doubles to 2 s. Same curve shape, stretched out."}]},
{id:"a2",cat:"AC & Reactive",lvl:1,type:"mc",circ:"rc",plot:"rcCharge",q:"The capacitor charges through the resistor from 0 V toward 5 V. After one time constant, it's at about:",
 ch:["63% (≈3.2 V)","50% (2.5 V)","37% (≈1.8 V)","100% (5 V)"],a:0,
 why:[null,"50% happens at about 0.69 τ (that's ln 2).","37% is what's <i>left</i> after one τ when discharging, the mirror image.","An RC never quite reaches 100%. It's within 1% after about 5 τ."],
 ex:"V = V_final(1 − e^(−t/τ)); at t = τ that's 63%.",key:"1τ → 63%, 5τ → ~99%",
 steps:[S("At the start the capacitor is empty, so all 5 V is across the resistor and the current is at its maximum: 0.5 mA.",{p:1,hl:[3],sel:3}),
  S("As the capacitor charges, there's less voltage left across the resistor, so less current, so it charges more slowly. That gives the curve V = 5 × (1 − e^(−t/τ)).",{p:2,sel:5}),
  S("At t = τ: 1 − e^(−1) = 0.632. After 3τ: 95%. After 5τ: 99.3%.",{p:3,sel:5})],
 try:[{ask:"Restart and watch the resistor's current. It will…",ch:["start at 0.5 mA and decay toward zero","stay at 0.5 mA","start at zero and rise"],a:0,set:[["restart"],["sel",3]],then:"The current is highest at the start and decays with the same τ. When the capacitor is full nothing flows, which is why a capacitor is 'open' at DC."}]},
{id:"a3",cat:"AC & Reactive",lvl:2,type:"num",circ:"lowpass",plot:"bode",q:"What's the cutoff (−3 dB) frequency of an RC low-pass with R = 1 kΩ and C = 0.1 µF?",ans:1591.5,unit:"Hz",tol:0.03,
 ex:"f_c = 1 / (2π·R·C) = 1 / (2π × 1000 × 1e−7) ≈ <b>1.59 kHz</b>.",key:"f_c = 1 / (2πRC)",
 steps:[S("At low frequencies the capacitor's reactance is huge, so it hardly affects the circuit and the output follows the input.",{p:1}),
  S("As frequency rises, X_C = 1/(2πfC) falls and the capacitor shunts more signal to ground. The −3 dB point is where X_C = R.",{p:2}),
  S("Solve 1/(2π f_c C) = R: f_c = 1/(2πRC) = 1/(2π × 1000 × 0.1 µ) ≈ 1,592 Hz.",{p:3}),
  S("The circuit below uses 1.6 kΩ and 100 µF so f_c ≈ 1 Hz, slow enough to watch. The source runs at 0.2 Hz.",{hl:[3],sel:3,p:3})],
 try:[{ask:"Change the source to 1 Hz (≈ f_c). The capacitor's peak voltage will be about…",ch:["0.7 V (−3 dB)","1 V","0.1 V"],a:0,set:[[0,"f",1],["sel",3]],then:"About 0.7 of the 1 V input. Give the trace a few seconds to settle."},
  {ask:"Now 5 Hz. The output will be…",ch:["about 0.2 V","about 0.7 V","about 1 V"],a:0,set:[[0,"f",5],["sel",3]],then:"About 0.2 V. Five times above f_c, the amplitude drops about five times: −20 dB per decade."}]},
{id:"a4",cat:"AC & Reactive",lvl:1,type:"mc",circ:"dcSteady",q:"In DC steady state, after everything settles, a capacitor acts like ___ and an inductor acts like ___.",
 ch:["an open circuit; a short circuit","a short circuit; an open circuit","an open circuit; an open circuit","a resistor; a resistor"],a:0,
 why:[null,"Backwards. A capacitor blocks steady current; an inductor passes it with no voltage drop.","An inductor's steady voltage is L·di/dt = 0, which makes it a short, not an open.","Only their small wire resistances (ESR, DCR) look resistive at DC."],
 ex:"Once nothing changes, i = C·dv/dt = 0 and v = L·di/dt = 0.",key:"DC: C = open, L = short.",
 steps:[S("A capacitor's current is C × dV/dt. Once its voltage stops changing, its current is zero: an open circuit.",{hl:[4],sel:4}),
  S("An inductor's voltage is L × dI/dt. Once its current stops changing, its voltage is zero: a short circuit.",{hl:[6],sel:6}),
  S("After settling, the capacitor carries 0 A, the inductor drops 0 V, and the node sits at 2.5 V, set only by the two 1 kΩ resistors.",{hl:[4,6],v:1})],
 try:[{ask:"Press Restart and watch the capacitor's current. At first it is…",ch:["large, then falls to zero","zero, then rises","constant"],a:0,set:[["restart"],["sel",4]],then:"An empty capacitor starts out like a short and takes current. Once charged it carries nothing. The transient and the DC picture are different."}]},
{id:"a5",cat:"AC & Reactive",lvl:1,type:"mc",circ:"capAC",q:"As frequency goes up, a capacitor's reactance:",
 ch:["Decreases","Increases","Stays the same","Becomes a negative resistance"],a:0,
 why:[null,"That's an inductor: X_L = 2πfL rises with frequency.","X_C = 1/(2πfC) clearly depends on f.","Reactance here is a positive magnitude. 'Negative resistance' is an active-device effect."],
 ex:"X_C = 1/(2πfC): it falls as frequency rises.",key:"Caps pass highs; inductors pass lows.",
 steps:[S("A capacitor's current depends on how fast its voltage changes: I = C × dV/dt.",{hl:[2],sel:2}),
  S("At a higher frequency, the same-sized sine changes faster, so more current flows for the same voltage. Less opposition means lower reactance."),
  S("Here, 100 µF at 0.5 Hz is X_C ≈ 3.2 kΩ; at 5 Hz it's about 320 Ω.",{hl:[2],sel:2})],
 try:[{ask:"Raise the frequency from 0.5 Hz to 5 Hz. The capacitor's current peak will…",ch:["grow about 10×","shrink 10×","stay the same"],a:0,set:[[0,"f",5],["sel",2]],then:"About 3.1 mA instead of 0.31 mA. That's why capacitors pass high frequencies (decoupling, AC coupling) and block DC."}]},
{id:"a6",cat:"AC & Reactive",lvl:1,type:"mc",q:"Why does every IC get a 0.1 µF capacitor right next to its power pin?",
 ch:["To supply fast current spikes locally and shunt high-frequency noise to ground","To set the IC's clock frequency","To block DC from reaching the IC","To raise the supply voltage"],a:0,
 why:[null,"Clocks come from crystals or oscillators; decoupling caps don't set frequency.","It's in parallel with the supply (pin to ground), not in series, so it doesn't block DC.","A capacitor can't raise a DC voltage on its own."],
 ex:"The trace to the regulator has inductance. A local cap supplies fast spikes before the supply can dip.",key:"Decoupling: small cap, very close, short loop.",
 steps:[S("When a digital IC switches, it pulls current in spikes lasting nanoseconds."),
  S("The trace back to the regulator has inductance, and V = L × di/dt. A fast di/dt makes the IC's local supply dip."),
  S("A small capacitor right at the pin supplies those spikes through a tiny loop with very little inductance. The regulator refills it slowly."),
  S("Placement matters more than the exact value: a 0.1 µF a few centimeters away is far less effective than one at the pin.")]},
{id:"a7",cat:"AC & Reactive",lvl:2,type:"mc",circ:"flyback",q:"Which of these cannot change instantaneously?",
 ch:["The current through an inductor (and the voltage across a capacitor)","The voltage across an inductor","The current through a capacitor","The voltage across a resistor"],a:0,
 why:[null,"An inductor's voltage can jump instantly. That's the spike.","A capacitor's current can jump instantly, like at the moment a switch closes.","A resistor's voltage follows its current instantly."],
 ex:"An instant jump in inductor current would need infinite voltage; in capacitor voltage, infinite current.",key:"Inductor current and capacitor voltage are continuous.",
 steps:[S("v = L × di/dt: changing an inductor's current instantly would take infinite voltage. i = C × dv/dt: changing a capacitor's voltage instantly would take infinite current."),
  S("So inductor current and capacitor voltage are continuous. Everything else can jump."),
  S("In this circuit, when the switch opens, the coil current continues smoothly through the diode, while the voltage at the bottom node jumps instantly from 0 V to about 12.7 V.",{hl:[2,8],sel:2})],
 try:[{ask:"Open the switch. The coil current will…",ch:["fade smoothly to zero","drop to zero instantly"],a:0,set:[[4,"v",0],["sel",2]],then:"It fades over a few time constants (L/R ≈ 10 ms, slowed down here). The voltage on the bottom node jumped instantly; the current didn't."}]},
{id:"a8",cat:"AC & Reactive",lvl:1,type:"num",plot:"sineRms",q:"A sine wave peaks at 170 V. What's its RMS value?",ans:120.2,unit:"V",
 ex:"V_rms = V_peak / √2 = 170 / 1.414 ≈ <b>120 V</b>.",key:"Sine: V_rms = V_pk / √2",
 steps:[S("RMS (root mean square) is the DC voltage that would heat a resistor by the same amount.",{p:1}),
  S("Square the sine, average it, take the square root. The average of sin² is ½, so V_rms = V_pk × √½ = V_pk ÷ √2.",{p:2}),
  S("170 ÷ 1.414 ≈ 120 V. Peak-to-peak is 340 V. The √2 rule only holds for pure sine waves.",{p:3})]},
{id:"a9",cat:"AC & Reactive",lvl:1,type:"mc",circ:"lowpass",plot:"bode",q:"At a filter's −3 dB point, the output has fallen to what fraction of its passband level?",
 ch:["≈70.7% of the amplitude (half the power)","50% of the amplitude (a quarter of the power)","≈30% of the amplitude","10% of the amplitude"],a:0,
 why:[null,"50% amplitude is −6 dB: a quarter of the power, not half.","30% amplitude is about −10 dB.","10% amplitude is −20 dB."],
 ex:"−3 dB is half power. Power ∝ V², so amplitude is 1/√2 ≈ 0.707.",key:"−3 dB = 0.707× amplitude = ½ power",
 steps:[S("Decibels compare power: dB = 10 × log₁₀(P₂/P₁). Half the power is 10 × log₁₀(0.5) = −3 dB.",{p:2}),
  S("Power goes with voltage squared, so half power means the voltage is multiplied by 1/√2 = 0.707.",{p:2}),
  S("That's why a filter's cutoff is called its '−3 dB point': power has halved and amplitude is 70.7%. This filter's f_c is about 1 Hz.",{p:3,hl:[3],sel:3})],
 try:[{ask:"Change the source to 1 Hz (the cutoff). The capacitor's peak becomes…",ch:["about 0.7 V","about 0.5 V","about 1 V"],a:0,set:[[0,"f",1],["sel",3]],then:"About 0.7 V out of 1 V: the −3 dB point. Give the trace a few seconds."}]},
{id:"a10",cat:"AC & Reactive",lvl:1,type:"num",q:"A voltage gain of 100× is how many dB?",ans:40,unit:"dB",
 ex:"For voltage, dB = 20·log₁₀(100) = <b>40 dB</b>.",key:"Voltage: dB = 20·log₁₀(ratio)",
 steps:[S("For voltage or current ratios, dB = 20 × log₁₀(ratio). The 20 comes from power ∝ V²: 10 × log of V² is 20 × log of V."),
  S("log₁₀(100) = 2, so 20 × 2 = 40 dB."),
  S("Handy ladder: ×2 ≈ 6 dB, ×10 = 20 dB, ×100 = 40 dB, ×1000 = 60 dB. Stages in a row add in dB: 20 dB then 20 dB gives 40 dB.")]},
// ---------- Power ----------
{id:"p1",cat:"Power",lvl:1,type:"num",circ:"linreg",q:"A linear regulator outputs 5 V at 0.5 A from a 12 V input. How much power does it turn into heat?",ans:3.5,unit:"W",
 ex:"(12 − 5) × 0.5 = <b>3.5 W</b>. Only 42% efficient.",key:"Linear reg loss = (Vin − Vout) · I",
 steps:[S("A linear regulator acts like a resistor that adjusts itself to drop exactly the extra voltage. The full load current flows through it. Here it's modeled as a 14 Ω resistor.",{hl:[2],sel:2}),
  S("It drops 12 − 5 = 7 V while passing 0.5 A: P = 7 × 0.5 = 3.5 W of heat.",{sel:2}),
  S("The load gets 5 × 0.5 = 2.5 W, so efficiency is 2.5/6 = 42%. Tap the load to compare.",{hl:[4],sel:4})],
 try:[{ask:"Suppose the input were 6 V instead (the regulator now drops only 1 V: set it to 2 Ω). Its power becomes…",ch:["0.5 W","3.5 W","6 W"],a:0,set:[[0,"v",6],[2,"v",2],["sel",2]],then:"1 V × 0.5 A = 0.5 W. Linear regulators are fine when the drop is small, which is why LDOs exist."}]},
{id:"p2",cat:"Power",lvl:1,type:"mc",plot:"buck",q:"A buck converter ___ voltage and a boost converter ___ voltage.",
 ch:["steps down; steps up","steps up; steps down","inverts; doubles","regulates AC; regulates DC"],a:0,
 why:[null,"Backwards. 'Buck' bucks (reduces) the voltage; 'boost' raises it.","Inverting and doubling are other topologies (inverting buck-boost, charge pump).","Both are DC-to-DC converters."],
 ex:"Both switch an inductor quickly and reach 85–95% efficiency.",key:"Buck ↓, boost ↑, both switch an inductor.",
 steps:[S("A buck converter chops the input on and off very fast (hundreds of kHz) with a transistor.",{p:1}),
  S("An inductor and capacitor smooth that square wave into DC. The average of the square wave is V_in × duty cycle.",{p:2}),
  S("A boost converter stores energy in an inductor and releases it on top of the input, raising the voltage. Neither burns off the difference as heat the way a linear regulator does.",{p:2})]},
{id:"p3",cat:"Power",lvl:2,type:"mc",q:"An LDO regulator's 'dropout voltage' is:",
 ch:["The minimum input-minus-output difference it needs to keep regulating","Its output voltage with no load","The drop across the output capacitor","The voltage at which it shuts down from heat"],a:0,
 why:[null,"With no load, the output is just the set voltage.","In steady state, output capacitors don't drop voltage.","That's thermal shutdown, a separate protection feature."],
 ex:"Below V_out + V_dropout, the output follows the input down.",key:"V_in ≥ V_out + V_dropout",
 steps:[S("A linear regulator's pass transistor needs some voltage across it to stay in control."),
  S("Dropout is the minimum V_in − V_out at which it still regulates. An LDO (low-dropout) might need only 100–300 mV."),
  S("Below that, the output follows the input down. A 3.3 V LDO with 200 mV dropout fed from a 3.4 V battery puts out about 3.2 V.")]},
{id:"p4",cat:"Power",lvl:2,type:"num",plot:"buck",q:"An ideal buck converter steps 12 V down to 3.3 V. What duty cycle does it run at?",ans:27.5,unit:"%",tol:0.03,
 ex:"D = V_out / V_in = 3.3 / 12 = <b>27.5%</b>.",key:"Buck: D = Vout / Vin",
 steps:[S("An ideal buck's output is the average of the chopped input.",{p:1}),
  S("V_out = D × V_in, so D = 3.3 ÷ 12 = 27.5%.",{p:2}),
  S("A boost is different: V_out = V_in ÷ (1 − D).",{p:2})]},
{id:"p5",cat:"Power",lvl:1,type:"num",q:"A 2000 mAh battery powers a device that draws 100 mA. Roughly how many hours will it last?",ans:20,unit:"h",
 ex:"2000 mAh / 100 mA = <b>20 h</b> ideally.",key:"Hours ≈ capacity (mAh) / load (mA)",
 steps:[S("mAh is current × time: 2000 mAh can supply 2000 mA for 1 hour, or 100 mA for 20 hours."),
  S("In practice capacity drops in the cold, with age, at high current, and because you stop at a cutoff voltage. Plan for 70–80%."),
  S("For sensors that sleep, average current is what counts: 10 mA for 1 s every minute plus 10 µA of sleep averages about 0.18 mA.")]},
{id:"p6",cat:"Power",lvl:1,type:"mc",circ:"scopeGnd",q:"Why add a fuse or PTC in series with a power input?",
 ch:["To open the circuit if current exceeds a safe level, such as during a short","To smooth voltage ripple","To regulate the voltage","To block reverse voltage"],a:0,
 why:[null,"Ripple is handled by capacitors and filters.","Regulation needs active control. A fuse just conducts or opens.","Reverse-polarity protection is a diode's or MOSFET's job."],
 ex:"It protects the wiring and the source from a fault downstream.",key:"Fuse/PTC = overcurrent protection.",
 steps:[S("A fuse is a deliberate weak link: a thin element that melts when current exceeds its rating."),
  S("Without one, a downstream short can pull enough current to burn traces or start a fire. Close the switch below to short the 12 V supply and see the current the simulator reports.",{hl:[6]}),
  S("A PTC does the same job but resets: it heats up, its resistance jumps, and it recovers once the fault clears.")],
 try:[{ask:"Close the switch to short the supply. The current will be…",ch:["thousands of amps (in this ideal circuit)","about 120 mA","zero"],a:0,set:[[6,"v",1]],then:"Only the wire resistance limits it. A real supply would current-limit or collapse, and a fuse would open in milliseconds."}]},
// ---------- Digital & mixed ----------
{id:"g1",cat:"Digital & ADC",lvl:1,type:"mc",circ:"pullup",q:"Why do I²C lines need pull-up resistors?",
 ch:["Devices only pull the lines low (open-drain); the resistor pulls them high when nobody drives","To limit current into the microcontroller","To terminate reflections at high speed","To set the bus clock frequency"],a:0,
 why:[null,"The microcontroller's input draws almost nothing, so there's no input current to limit.","Termination is for fast transmission lines. I²C is slow and open-drain.","The controller sets the clock. The pull-up only affects how fast edges rise."],
 ex:"Open-drain devices can only pull low. The resistor provides the 'high'.",key:"Open-drain needs a pull-up.",
 steps:[S("Each I²C device can only connect the line to ground (open-drain). None of them can drive it high.",{hl:[3,5]}),
  S("With both devices released, the pull-up resistor brings the line up to 3.3 V. Node voltages are on.",{hl:[2],v:1}),
  S("When any device closes its switch, the line drops to 0 V. Several devices can share one line without ever fighting.",{hl:[3]})],
 try:[{ask:"Close device A's switch. The line goes to…",ch:["0 V","1.65 V","3.3 V"],a:0,set:[[3,"v",1],["sel",2]],then:"0 V. The pull-up now carries 3.3 V ÷ 4.7 kΩ = 0.7 mA, which device A sinks."},
  {ask:"Close device B too. Is there a conflict?",ch:["No: both just pull low","Yes: a short circuit"],a:0,set:[[5,"v",1],["sel",2]],then:"No conflict; the line is simply low. If one device could drive high while another drove low, that would be a short. Open-drain avoids it."}]},
{id:"g2",cat:"Digital & ADC",lvl:1,type:"num",plot:"adc",q:"A 12-bit ADC uses a 3.3 V reference. What's one LSB?",ans:0.806,unit:"mV",
 ex:"3.3 V / 2¹² = 3.3 / 4096 ≈ <b>0.806 mV</b>.",key:"LSB = V_ref / 2ᴺ",
 steps:[S("An N-bit ADC splits its reference range into 2ᴺ steps. 12 bits gives 4096 steps.",{p:1}),
  S("One step (1 LSB) = 3.3 V ÷ 4096 = 0.806 mV.",{p:1}),
  S("Every reading is rounded to the nearest step, so there's up to ±½ LSB of quantization error. In practice noise and reference accuracy usually limit you first.",{p:1})]},
{id:"g3",cat:"Digital & ADC",lvl:1,type:"mc",plot:"alias",q:"A signal has content up to 1 kHz. What's the minimum sample rate to avoid aliasing?",
 ch:["More than 2 kHz","1 kHz","500 Hz","Any rate works; aliasing only affects audio"],a:0,
 why:[null,"Sampling at exactly the signal frequency catches the same point every cycle, so it looks like DC.","Below the Nyquist rate, frequencies fold back as false, lower ones.","Aliasing happens to any sampled signal: sensors, scopes, audio."],
 ex:"Nyquist: sample at more than twice the highest frequency present.",key:"f_s > 2 · f_max",
 steps:[S("Sampling takes snapshots. With too few per cycle, the dots can be joined up into a slower wave that isn't really there.",{p:1}),
  S("Here a 9 Hz sine sampled at 10 Hz looks exactly like a 1 Hz sine. The ADC can't tell the difference.",{p:2}),
  S("Nyquist: sample faster than twice the highest frequency present, so every cycle gets at least two samples. In practice, 5–10× plus a filter.",{p:2})]},
{id:"g4",cat:"Digital & ADC",lvl:2,type:"mc",plot:"alias",q:"Where does the anti-aliasing filter go?",
 ch:["Before the ADC, in the analog domain","After the ADC, in software","On the reference pin","Only after a DAC"],a:0,
 why:[null,"Once a signal has aliased, the false frequency is indistinguishable from a real one, so software can't remove it.","The reference sets the scale, not the bandwidth.","DACs need reconstruction filters, but this question is about the ADC input."],
 ex:"Remove high frequencies before sampling; afterwards it's too late.",key:"Filter before you sample.",
 steps:[S("Aliasing happens at the instant of sampling: anything above half the sample rate folds down.",{p:2}),
  S("Afterwards, a folded 9 Hz component looks exactly like a real 1 Hz signal. No digital filter can separate them.",{p:2}),
  S("So high frequencies are removed before sampling, in the analog domain, often with a simple RC low-pass right at the ADC pin.")]},
{id:"g5",cat:"Digital & ADC",lvl:1,type:"num",plot:"adc",q:"A 10-bit ADC with a 5 V reference reads 512. Roughly what voltage is that?",ans:2.5,unit:"V",
 ex:"V = 512 / 1024 × 5 = <b>2.5 V</b>.",key:"V = code / 2ᴺ · V_ref",
 steps:[S("The code is a fraction of the reference: V = code ÷ 2ᴺ × V_ref.",{p:1}),
  S("512 ÷ 1024 = 0.5, and 0.5 × 5 V = 2.5 V."),
  S("Each LSB here is 5/1024 ≈ 4.9 mV, so the reading means 2.5 V ± about 2.4 mV.")]},
{id:"g6",cat:"Digital & ADC",lvl:1,type:"mc",plot:"bounce",q:"Why do mechanical push-buttons need debouncing?",
 ch:["The contacts bounce for a few ms, creating several edges for one press","They draw too much current","They invert the logic level","They need time to charge an internal capacitor"],a:0,
 why:[null,"Buttons carry tiny currents.","The wiring sets the logic level, not the button.","A button has no internal capacitor."],
 ex:"One press produces a burst of edges unless you filter them.",key:"One press ≠ one edge, unless you debounce.",
 steps:[S("When metal contacts close, they bounce apart and together for a few milliseconds.",{p:1}),
  S("A fast microcontroller sees every bounce as a separate press."),
  S("Debounce: ignore changes for 10–20 ms after the first edge (software), or use an RC filter and a Schmitt-trigger input (hardware).",{p:2})]},
{id:"g7",cat:"Digital & ADC",lvl:1,type:"mc",circ:"nmosLow",q:"What happens when a CMOS input pin is left floating?",
 ch:["It drifts between logic levels, toggles randomly and can draw extra current","It reads a solid 0","It reads a solid 1","Nothing; CMOS inputs default high"],a:0,
 why:[null,"Floating doesn't mean 0. Nothing defines its voltage.","Floating doesn't mean 1 either.","CMOS inputs have no built-in default unless a pull-up or pull-down is enabled."],
 ex:"A CMOS input is a MOSFET gate: a tiny capacitor with no DC path.",key:"Never leave CMOS inputs floating.",
 steps:[S("A CMOS input is the gate of a pair of MOSFETs: a tiny capacitor with no DC path, like the gate in this circuit.",{hl:[3]}),
  S("With nothing connected, its voltage drifts with leakage and nearby noise."),
  S("Near mid-rail, both transistors turn partly on, which wastes current and can oscillate. Tie unused inputs to a rail or enable the internal pull-up/down.",{hl:[8]})],
 try:[{ask:"Delete the pull-down and open the pin switch. The gate (like a floating input) will…",ch:["hold whatever voltage it had","snap to 0 V"],a:0,set:[["del",8],[1,"v",0],["sel",3]],then:"It holds its charge, because nothing defines it. In a real chip, leakage and noise would then push it around unpredictably."}]},
// ---------- Sensors & measurement ----------
{id:"m1",cat:"Sensors",lvl:1,type:"mc",circ:"fourTwenty",plot:"fourTwenty",q:"Why does a 4–20 mA sensor loop use 4 mA, not 0 mA, as the bottom of its range?",
 ch:["So 0 mA means a fault (e.g. a broken wire) and the sensor has current to power itself","Because 0 mA is unsafe","To reduce cable resistance","Because ADCs can't read zero"],a:0,
 why:[null,"0 mA isn't dangerous; the reason is diagnostic.","Cable resistance doesn't affect a current loop's reading, and the 4 mA offset doesn't change the cable.","ADCs read 0 V without trouble."],
 ex:"A 'live zero' separates 'minimum reading' from 'loop is dead'.",key:"4 mA live zero = fault detection + power.",
 steps:[S("In a current loop the transmitter forces a current, and it's the same everywhere around the series loop (KCL).",{hl:[0,1,3,4],sel:3}),
  S("So cable resistance doesn't change the reading: the sense resistor always sees the true loop current.",{hl:[3],sel:3}),
  S("Reserving 0–4 mA means 0 mA can only be a fault (broken wire, dead transmitter). The transmitter can also run on that minimum 4 mA.",{p:1})],
 try:[{ask:"Change both cable resistances to 200 Ω (a much longer run). The sense voltage will…",ch:["stay at 3 V","drop","rise"],a:0,set:[[1,"v",200],[4,"v",200],["sel",3]],then:"Still 3 V. The transmitter just works harder (its voltage rises) to push 12 mA. A voltage signal on the same cable would have lost accuracy."}]},
{id:"m2",cat:"Sensors",lvl:1,type:"num",circ:"fourTwenty",q:"A 4–20 mA loop is read across a 250 Ω resistor. What voltage do you see at 12 mA?",ans:3,unit:"V",
 ex:"V = 0.012 × 250 = <b>3 V</b>.",key:"250 Ω turns 4–20 mA into 1–5 V.",
 steps:[S("The sense resistor converts current into voltage: V = I × R.",{hl:[3],sel:3}),
  S("0.012 A × 250 Ω = 3 V."),
  S("4 mA gives 1 V and 20 mA gives 5 V, so the range maps neatly onto a 0–5 V ADC input.")],
 try:[{ask:"Set the transmitter to 20 mA (full scale). The sense voltage becomes…",ch:["5 V","4 V","20 V"],a:0,set:[[0,"v",0.02],["sel",3]],then:"0.020 × 250 = 5 V."}]},
{id:"m3",cat:"Sensors",lvl:1,type:"num",circ:"shunt",q:"A 0.1 Ω shunt resistor carries 2 A. What voltage appears across it?",ans:200,unit:"mV",
 ex:"V = 2 × 0.1 = <b>200 mV</b>, and it dissipates 0.4 W.",key:"Shunt: V = I·R, keep R small.",
 steps:[S("A shunt is a small, precise resistor in the current path. The voltage across it is proportional to the current.",{hl:[3],sel:3}),
  S("V = 2 A × 0.1 Ω = 0.2 V = 200 mV."),
  S("Check its power: 2² × 0.1 = 0.4 W. Here it's on the low side (ground end): easy to measure, but it lifts the load's ground by 200 mV.",{hl:[3],v:1,sel:3})],
 try:[{ask:"Use a 10 mΩ shunt instead. The voltage across it becomes…",ch:["20 mV","200 mV","2 V"],a:0,set:[[3,"v",0.01],["sel",3]],then:"20 mV and only 40 mW of loss. But now you need an amplifier with very low offset to read it accurately. Shunt choice trades signal size against loss."}]},
{id:"m4",cat:"Sensors",lvl:1,type:"mc",plot:"ntc",q:"What happens to an NTC thermistor's resistance as temperature rises?",
 ch:["It decreases","It increases","It stays constant until a threshold","It oscillates"],a:0,
 why:[null,"That's a PTC thermistor or an RTD.","It changes continuously, though not linearly.","Nothing in a thermistor oscillates."],
 ex:"NTC = negative temperature coefficient: hotter means lower resistance.",key:"NTC: hotter → lower R. RTD: hotter → higher R.",
 steps:[S("NTC stands for negative temperature coefficient: resistance goes down as temperature goes up.",{p:1}),
  S("The change is large but curved: a 10 kΩ NTC is about 33 kΩ at 0 °C and 3.6 kΩ at 50 °C.",{p:1}),
  S("RTDs like the Pt100 go the other way, rising about 0.385 Ω/°C. Much straighter, but a far smaller change.",{p:2})]},
{id:"m5",cat:"Sensors",lvl:2,type:"mc",circ:"kelvin",q:"Why use 4-wire (Kelvin) sensing to measure a low resistance?",
 ch:["Current flows on one pair of wires and voltage is measured on a separate pair, so lead resistance adds no error","It doubles the test current","It cancels thermal noise","It allows AC measurement"],a:0,
 why:[null,"The test current is a separate choice.","Thermal EMFs and noise need other techniques (current reversal, averaging).","4-wire works fine at DC; that's how it's normally used."],
 ex:"The sense pair carries almost no current, so it drops almost nothing.",key:"Kelvin: separate force and sense paths.",
 steps:[S("The part under test (DUT) is 10 mΩ, but each lead is 100 mΩ. A 2-wire meter would measure the DUT plus both leads.",{hl:[1,3,4]}),
  S("Tap the current source: its voltage is 0.21 V, which would read as 210 mΩ, 21× too high.",{hl:[0],sel:0}),
  S("The separate sense leads carry almost no current (the voltmeter is 10 MΩ), so they drop nothing. The voltmeter reads 10 mV: exactly 1 A × 10 mΩ.",{hl:[7,8,9],sel:8})],
 try:[{ask:"Make each sense lead 10 Ω. The voltmeter reading will…",ch:["still be about 10 mV","jump a lot","drop to zero"],a:0,set:[[7,"v",10],[9,"v",10],["sel",8]],then:"Still 10 mV. Almost no current flows in the sense leads, so their resistance doesn't matter."}]},
{id:"m6",cat:"Sensors",lvl:2,type:"mc",circ:"probe",q:"Why do oscilloscope probes usually sit on 10×?",
 ch:["They present ~10 MΩ and much less capacitance, so they load the circuit less","They make the signal 10× bigger","They add 10× bandwidth gain","They filter out DC"],a:0,
 why:[null,"A 10× probe makes the signal 10× <i>smaller</i>.","Passive probes don't add gain.","DC passes through fine. Blocking DC is the scope's AC-coupling setting."],
 ex:"A probe is a load. 10× mode is a much lighter load.",key:"10× probe = less loading, less signal.",
 steps:[S("Every probe is a load: connecting it puts its input resistance between your node and ground.",{hl:[7]}),
  S("This divider has 500 kΩ of Thévenin resistance. A 1 MΩ (1×) probe drags the 5 V node down to 3.33 V."),
  S("A 10× probe presents 10 MΩ, so the node only drops to 4.76 V. It also has far less capacitance, which matters even more at high frequency.")],
 try:[{ask:"Close the probe switch (1×, 1 MΩ). The node reads…",ch:["3.33 V","5 V","10 V"],a:0,set:[[6,"v",1],["sel",3]],then:"The probe changed the circuit it was measuring."},
  {ask:"Change the probe to 10 MΩ (10× mode). The node becomes…",ch:["4.76 V","5 V","3.33 V"],a:0,set:[[7,"v",1e7],["sel",3]],then:"Much closer to the true 5 V, although the scope sees it divided by 10."}]},
{id:"m7",cat:"Sensors",lvl:2,type:"mc",circ:"groundLoop",q:"A 'ground loop' causes trouble because:",
 ch:["Two grounds at different potentials let current flow through the shield/ground path, adding noise or offset","Ground wires form an inductor that blocks DC","It shorts the supply","It makes the oscilloscope ground float"],a:0,
 why:[null,"A wire doesn't block DC.","The supply isn't involved. The problem is current in the ground path.","A floating scope ground is a separate (and dangerous) topic."],
 ex:"Ground isn't one voltage everywhere. Two connections make a loop for current.",key:"Ground isn't one voltage everywhere.",
 steps:[S("The sensor's ground and the ADC's ground are joined twice: by the ground wire and through earth. That's a loop.",{hl:[4,6,7]}),
  S("There's 0.5 V between the two earth points, which drives current around the loop through the 1 Ω ground wire.",{hl:[6,4],sel:4}),
  S("That current drops voltage on the ground wire, so the ADC sees the sensor's 1 V shifted by a quarter of a volt.",{hl:[2],sel:2})],
 try:[{ask:"Delete the earth connection to break the loop. The ADC reading will…",ch:["become exactly 1 V","stay shifted"],a:0,set:[["del",7],["sel",2]],then:"No loop, no current in the ground wire, no error. In practice: single-point grounding, differential inputs, or isolation."}]},
{id:"m8",cat:"Sensors",lvl:2,type:"mc",circ:"scopeGnd",q:"You clip a mains-powered scope's ground lead to a point that isn't at earth potential. What happens?",
 ch:["You short that point to earth through the scope, which can destroy parts or the probe","The scope automatically measures differentially","Nothing; the probe ground is isolated","The trace just inverts"],a:0,
 why:[null,"A normal bench scope's channels are single-ended and referenced to earth.","On mains-powered bench scopes the ground clip is tied to earth through the power cord.","It's a short circuit, not a display change."],
 ex:"Every ground clip on a bench scope is earth.",key:"Scope ground clip = earth. Clip carefully.",
 steps:[S("On a mains-powered bench scope, every ground clip connects to earth through the power cord.",{hl:[6,7]}),
  S("If your circuit's ground is also earth, clipping onto any other node shorts that node to ground."),
  S("Close the 'scope clip' switch: it connects +12 V straight to earth.",{hl:[6]})],
 try:[{ask:"Close the clip switch. What happens?",ch:["A huge short-circuit current flows","The scope just reads 12 V"],a:0,set:[[6,"v",1]],then:"The simulator flags a short. In real life: blown traces, a damaged probe or a tripped breaker. Use a differential probe, or measure on two channels and subtract."}]},
// ---------- Tap-the-schematic (reading circuits) ----------
{id:"k1",cat:"Read the schematic",lvl:1,type:"tap",circ:"series",q:"Tap the resistor with the largest voltage across it.",ans:[5],
 ex:"Same current through all three, so the largest resistance (3 kΩ) drops the most: 4.5 V.",key:"In series, voltage divides in proportion to resistance.",
 steps:[S("First question to ask: series or parallel? One loop, no junctions: series. Same 1.5 mA through every resistor.",{hl:[2,3,5]}),
  S("V = I × R with the same I everywhere, so the biggest R gets the biggest V: 3 kΩ × 1.5 mA = 4.5 V.",{hl:[5],v:1,sel:5})]},
{id:"k2",cat:"Read the schematic",lvl:1,type:"tap",circ:"parallel",q:"Tap the resistor carrying the most current.",ans:[2],
 ex:"All three have 9 V across them, so the smallest resistance (1 kΩ) carries the most: 9 mA.",key:"In parallel, current divides inversely with resistance.",
 steps:[S("Each resistor connects between the top and bottom wires, so each has the full 9 V across it.",{hl:[2,3,4],v:1}),
  S("I = V ÷ R with the same V everywhere, so the smallest R carries the most: 9 V ÷ 1 kΩ = 9 mA. Compare the dot speeds.",{hl:[2],sel:2})]},
{id:"k3",cat:"Read the schematic",lvl:1,type:"tap",mode:"node",circ:"divider",q:"Tap the junction that sits at 3.33 V.",ans:["7,5"],
 ex:"The midpoint between the resistors: 10 V × 5k / 15k = 3.33 V.",key:"Nodes are where you measure voltage; parts are what voltage drops across.",
 steps:[S("Voltages live at nodes. This circuit has three: the top (10 V), the bottom (0 V) and the junction between the resistors.",{v:1}),
  S("The junction sits below the 10 kΩ, which drops 6.67 V: 10 − 6.67 = 3.33 V.",{hl:[2,3],v:1})]},
{id:"k4",cat:"Read the schematic",lvl:1,type:"tap",circ:"led",q:"Tap the part that drops about 3 V.",ans:[2],
 ex:"The LED takes about 2 V, so the resistor takes the remaining 3 V of the 5 V supply.",key:"Drops around a loop add up to the supply.",
 steps:[S("Around the loop, the drops must add up to the 5 V supply (KVL).",{hl:[2,4]}),
  S("The LED drops about 2 V, the wires and closed switch drop nearly nothing, so the resistor takes the remaining 3 V.",{hl:[2],v:1,sel:2})]},
{id:"k5",cat:"Read the schematic",lvl:2,type:"tap",mode:"node",circ:"bridge",q:"Tap the bridge midpoint that's at the higher voltage.",ans:["9,5"],
 ex:"The right midpoint: the bottom-right arm is larger (1.1 kΩ), so its share of the 5 V is bigger: 2.62 V vs 2.50 V.",key:"A bigger bottom resistor raises a divider's midpoint.",
 steps:[S("Each midpoint is a divider output: V = 5 × R_bottom ÷ (R_top + R_bottom).",{hl:[2,3,4,5]}),
  S("Left: 1k/(1k+1k) gives 2.50 V. Right: 1.1k/(1k+1.1k) gives 2.62 V. The right one is higher.",{v:1,hl:[5]})]},
{id:"k6",cat:"Read the schematic",lvl:1,type:"tap",circ:"diodeDir",q:"Only one of these LEDs is lit. Tap it.",ans:[3],
 ex:"The left LED's arrow points from the + side to the − side, so it's forward biased.",key:"Current flows the way the diode arrow points.",
 steps:[S("Find which side of each LED is more positive. The top of both branches connects to +5 V.",{v:1}),
  S("The left LED's arrow points down, away from +: forward biased, lit. The right one points up, toward +: reverse biased, dark.",{hl:[3,5],sel:3})]},
{id:"k7",cat:"Read the schematic",lvl:2,type:"tap",circ:"rc",at:8,q:"The switch has been closed for a long time. Tap the part (not a wire or switch) with almost no voltage across it.",ans:[3],
 ex:"Fully charged, the capacitor holds 5 V and no current flows, so the resistor drops 0 V.",key:"At DC steady state, a capacitor is an open circuit.",
 steps:[S("After many time constants, the capacitor has charged to 5 V and its current has stopped.",{hl:[5],sel:5}),
  S("No current means no drop across the resistor: V = I × R = 0.",{hl:[3],sel:3})]},
{id:"k8",cat:"Read the schematic",lvl:1,type:"tap",mode:"node",circ:"series",q:"Tap any point that's at the battery's full 9 V.",ans:["1,2"],
 ex:"Anything connected by plain wire to the battery's + terminal is at 9 V, until the first resistor.",key:"A wire is one node: every point on it has the same voltage.",
 steps:[S("A plain wire has (almost) no resistance, so it has no voltage drop. Every point joined by wire is one node.",{hl:[1]}),
  S("The + terminal and the wire up to the first resistor are all at 9 V. After the 1 kΩ, it's 7.5 V.",{v:1,hl:[1,2]})]},
{id:"k9",cat:"Read the schematic",lvl:2,type:"tap",circ:"dcSteady",at:6,q:"After this circuit settles, which part carries no current? Tap it.",ans:[4],
 ex:"The capacitor: at steady DC its voltage stops changing, so i = C·dv/dt = 0.",key:"DC steady state: C = open, L = short.",
 steps:[S("Once things settle, a capacitor's voltage stops changing, so its current is C × dV/dt = 0.",{hl:[4],sel:4}),
  S("The inductor is the opposite: it keeps carrying 2.5 mA but drops no voltage.",{hl:[6],sel:6})]},
{id:"k10",cat:"Read the schematic",lvl:2,type:"tap",circ:"bridgeRect",at:0.25,q:"At this moment the source's top terminal is at its positive peak. Tap a diode that is conducting.",ans:[3,6],
 ex:"Top-right and bottom-left: current goes out of the top, through the top-right diode to the load, and back through the bottom-left diode.",key:"Follow the current from + back to −, only along arrows that point the right way.",
 steps:[S("Start at the source's + (top) terminal. Current can only leave through a diode whose arrow points away from that node: the top-right one.",{hl:[3],sel:3}),
  S("After the load, it returns to the source's − (bottom) terminal through the only diode pointing that way: the bottom-left one.",{hl:[6,11],sel:6})]},
{id:"k11",cat:"Read the schematic",lvl:2,type:"tap",circ:"zener",q:"If the battery rose from 12 V to 15 V, which part would take almost all of the extra 3 V? Tap it.",ans:[2],
 ex:"The series resistor. The Zener holds its node at 5.1 V, so any extra input voltage lands on the resistor.",key:"In a shunt regulator, the series resistor absorbs input changes.",
 steps:[S("The Zener and load are in parallel, held at about 5.1 V by the Zener.",{hl:[4,5],v:1}),
  S("KVL: battery = resistor drop + 5.1 V. If the battery goes up 3 V, the resistor drop goes up 3 V.",{hl:[2],sel:2})]},
{id:"k12",cat:"Read the schematic",lvl:2,type:"tap",mode:"node",circ:"opInv",q:"Tap the node that sits at 0 V without being wired to ground (the virtual ground).",ans:["5,4"],
 ex:"The op-amp's − input. Feedback forces it to match the grounded + input.",key:"With negative feedback, V− follows V+.",
 steps:[S("The + input is wired to ground. With negative feedback through R_f, the op-amp drives its output until V− equals V+.",{hl:[3,7]}),
  S("So the − input, where R_in and R_f meet, sits at 0 V, even though no wire connects it to ground.",{v:1,hl:[2,7]})]},
{id:"k13",cat:"Read the schematic",lvl:1,type:"tap",circ:"bjt",q:"Tap the resistor that sets the transistor's base current.",ans:[2],
 ex:"R_B: the base current is (V_BB − 0.7 V) / R_B = 5 V / 100 kΩ = 50 µA.",key:"Base resistor sets I_B; collector resistor sets the load line.",
 steps:[S("Find the path into the base: from V_BB, through a resistor, into the base pin.",{hl:[0,2,3]}),
  S("The base-emitter junction drops about 0.7 V, so I_B = (5.7 − 0.7) ÷ 100 kΩ = 50 µA.",{hl:[2],sel:3})]},
{id:"k14",cat:"Read the schematic",lvl:2,type:"tap",circ:"nmosLow",q:"Tap the resistor that keeps the load off if the microcontroller pin floats.",ans:[8],
 ex:"The 100 kΩ pull-down from gate to ground. It drains the gate's charge when nothing drives it.",key:"Gate pull-down = defined 'off' state.",
 steps:[S("The 100 Ω (R_G) is in series with the gate; it only shapes switching speed.",{hl:[2]}),
  S("The 100 kΩ goes from the gate to ground. When the pin floats, it pulls the gate to 0 V and turns the FET off.",{hl:[8]})]}
];
const BANK_BY_ID=Object.fromEntries(BANK.map(q=>[q.id,q]));
/* ================= LABEL PLACEMENT =================
   Every label tries a list of candidate spots around its part and takes the one that collides least with
   other labels, wires, part bodies and the canvas edge. Plans are cached until the circuit or size changes. */
const LFONT="500 11px 'IBM Plex Mono', ui-monospace, monospace",LH=13;
function segRect(x1,y1,x2,y2,r){let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;const p=[-dx,dx,-dy,dy],q=[x1-r.x0,r.x1-x1,y1-r.y0,r.y1-y1];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return false;}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return false;if(t>t0)t0=t;}else{if(t<t0)return false;if(t<t1)t1=t;}}}return true;}
function rectOv(a,b){const w=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),h=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);return w>0&&h>0?w*h:0;}
function partHalfWidth(t){return t==="v"||t==="c"?13:t==="a"||t==="i"?14:DIODES[t]?(t==="led"?17:10):t==="s"?13:7;}

const VIEWS=new Set();
class SimView{
  constructor(canvas,opt){this.cv=canvas;this.ctx=canvas.getContext("2d");this.mode=opt.mode||"embed";this.ckt=new Circuit([]);

    this.imax=1e-9;this.vScale=1;this.preview=null;this.drag=null;this.dirty=true;this.interact=opt.interact||"inspect";this.showI=this.mode==="main";
    this.banner=opt.banner||null;this.onPick=opt.onPick||null;this.inspector=null;this.acc=0;this.tool=()=>"select";
    canvas.addEventListener("pointerdown",ev=>this.down(ev));canvas.addEventListener("pointermove",ev=>this.move(ev));canvas.addEventListener("pointerup",ev=>this.up(ev));

  idxOf(e){return this.byIdx?this.byIdx.indexOf(e):-1;}

    if(this.mode==="main"){this.G=Math.max(22,Math.min(34,Math.floor(w/11.5)));this.cols=Math.floor(w/this.G);this.rows=10;this.ox=(w-(this.cols-1)*this.G)/2;this.oy=this.G*0.6;
      h=Math.round((this.rows-1)*this.G+this.oy*2);this.flipX=this.cols-3;this.leftX=1;}
    else{let x0=99,y0=99,x1=-99,y1=-99;for(const e of this.byIdx||[])for(const p of terms(e)){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
      if(x0>x1){x0=0;x1=10;y0=0;y1=8;}
      const f=this.fitEmbed(w,x0,y0,x1,y1);this.G=f.G;this.ox=f.ox;this.oy=f.oy;h=f.h;this.flipX=x1-1;this.leftX=x0;this.cols=0;this.rows=0;}
    this.cssW=w;this.cssH=h;this.cv.width=Math.round(w*dpr);this.cv.height=Math.round(h*dpr);this.cv.style.height=h+"px";this.ctx.setTransform(dpr,0,0,dpr,0,0);this.dirty=true;}
  fitEmbed(w,x0,y0,x1,y1){const G0=Math.max(16,Math.min(34,(w-40)/Math.max(1,x1-x0)));let best=null;
    for(const s of [1,0.94,0.88,0.82,0.76,0.7,0.64,0.58]){const G=Math.max(14,G0*s),ox=(w-(x1-x0)*G)/2-x0*G,oy=26-y0*G,h=(y1-y0)*G+56,P=p=>[ox+p[0]*G,oy+p[1]*G];
      const Pf=p=>[ox+p[0]*G,oy+500+p[1]*G];const plan=planLabels(this.ctx,this.ckt,{G,ox,oy:oy+500,W:w,H:1e5,live:false},Pf,new Map());let top=0,bot=h,bad=0;
      for(const L of plan){top=Math.min(top,L.r.y0-500-4);bot=Math.max(bot,L.r.y1-500+4);bad+=Math.min(L.r.score,6000)-(L.r.score<400?L.r.score:0);}

  pt(ev){const r=this.cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];}

      this.preview=(g2[0]!==this.drag.g[0]||g2[1]!==this.drag.g[1])?mkEl(t,this.drag.g[0],this.drag.g[1],g2[0],g2[1]):null;this.dirty=true;}}
  up(ev){if(!this.drag)return;const px=this.pt(ev),g2=this.gridOf(px),d=this.drag;this.drag=null;this.preview=null;this.dirty=true;
    if(this.interact==="edit"){const t=this.tool();
      if(!["select","erase","g"].includes(t)&&!TRI[t]&&d.moved&&(g2[0]!==d.g[0]||g2[1]!==d.g[1])){const e=mkEl(t,d.g[0],d.g[1],g2[0],g2[1]);this.ckt.els.push(e);this.ckt.rebuild();this.select(this.ckt.els.includes(e)?e:null);return;}

      if(TRI[t]&&!d.moved){const fp=footprint(t,d.g[0],d.g[1]);if(fp.every(p=>p[0]>=0&&p[1]>=0&&p[0]<this.cols&&p[1]<this.rows)){const e=mkEl(t,d.g[0],d.g[1]);this.ckt.els.push(e);this.ckt.rebuild();this.select(e);}return;}

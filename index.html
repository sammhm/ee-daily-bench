<title>Daily Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, a segmented tab bar, quiz cards on paper; circuits and plots live on a dark "bench screen" in both themes */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --fg:#18231E; --muted:#5B6B63; --line:#D9E0DB; --soft:#EEF2EF;
  --accent:#1D6B4E; --accent-ink:#FFFFFF; --copper:#A85A22;
  --ok:#1F7A45; --ok-bg:#E3F3E8; --bad:#B4351F; --bad-bg:#FBE7E2; --info-bg:#E8F0F7; --info:#2B5C86;
  --screen:#0E1A16; --screen-line:#24372F;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17211D; --fg:#E4ECE7; --muted:#93A69C; --line:#2A3832; --soft:#1C2823;
  --accent:#4FB98A; --accent-ink:#0B1410; --copper:#E0995C;
  --ok:#5CCB8A; --ok-bg:#16301F; --bad:#F08A72; --bad-bg:#3A1C16; --info-bg:#172634; --info:#8DBBE3;
  --screen:#0A1310; --screen-line:#22342C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17211D; --fg:#E4ECE7; --muted:#93A69C; --line:#2A3832; --soft:#1C2823;
  --accent:#4FB98A; --accent-ink:#0B1410; --copper:#E0995C;
  --ok:#5CCB8A; --ok-bg:#16301F; --bad:#F08A72; --bad-bg:#3A1C16; --info-bg:#172634; --info:#8DBBE3;
  --screen:#0A1310; --screen-line:#22342C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.brand span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:520px){.brand span{display:none}}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs a{font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:7px}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;text-wrap:balance}
h4{font-family:var(--f-display);font-weight:700;font-size:.95rem;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* today */
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 18px;margin-block:6px 14px}
.stats{display:flex;gap:18px}
.stat b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.meter i{height:6px;border-radius:3px;background:var(--line)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.q-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--copper);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.chip.rev{color:var(--info)} .chip.tap{color:var(--accent)}
.lvl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.qn{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.q-text{font-size:1.05rem;font-weight:600;margin:0 0 12px;line-height:1.45}
.schem{margin:0 0 14px;background:var(--screen);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.schem canvas{width:100%;display:block;touch-action:manipulation}
.schem.tapmode canvas{cursor:pointer}
.choices{display:grid;gap:8px}
.choice{text-align:left;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.choice.right{background:var(--ok-bg);border-color:var(--ok)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice:disabled{cursor:default}
.numform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numform input{font:inherit;font-family:var(--f-mono);width:9em;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.unit{font-family:var(--f-mono);color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn.link{border:none;background:none;color:var(--accent);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.5;cursor:default}
.screen-btn{font:inherit;font-size:.78rem;font-weight:600;border-radius:7px;padding:4px 10px;cursor:pointer;background:transparent;color:#9FD8BC;border:1px solid #2F5C49}
.screen-btn[aria-pressed="true"]{background:#24453A}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--info-bg);color:var(--fg);font-size:.92rem}
.hintbox b{color:var(--info)}
.tapbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tapbar .picked{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.result{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.verdict{border-radius:9px;padding:12px 14px;border-left:3px solid var(--ok);background:var(--ok-bg)}
.verdict.no{border-left-color:var(--bad);background:var(--bad-bg)}
.verdict strong{display:block;margin-bottom:4px}
.verdict p{margin:.35em 0}
.whynot{font-size:.93rem}
.whynot b{font-weight:600}
.key{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:0}
.walk{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.walk .stepnum{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.walk .steptext{margin:0;min-height:3em}
.walk .nav{display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tryit{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tryit .ask{margin:0;font-weight:600}
.tryit .opts{display:flex;flex-wrap:wrap;gap:8px}
.tryit .opts button{font:inherit;font-size:.88rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tryit .opts button:hover:not(:disabled){border-color:var(--accent)}
.tryit .opts button.right{background:var(--ok-bg);border-color:var(--ok)}
.tryit .opts button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tryit .then{margin:0;padding:10px 12px;border-radius:8px;background:var(--soft)}
.lab-read{font-family:var(--f-mono);font-size:.76rem;color:#BFD6CB;display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 4px;min-height:1.4em}
.lab-read b{color:#E6F0EB;font-weight:500}
.lab-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab-ctl .grow{flex:1}
.schem .valform label{color:#BFD6CB;font-size:.8rem}
.schem .valform input{background:#12221C;color:#E6F0EB;border-color:#2F5C49;width:7em;padding:4px 8px}
.schem .unit{color:#9FBCAF}
.plotwrap{background:var(--screen);border-radius:10px;padding:6px}
.plotwrap canvas{width:100%;display:block}
.done{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section-label{margin:26px 0 10px}
.guess{align-self:flex-start}
/* sim */
.toolbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tool{flex:0 0 auto;font:inherit;font-size:.82rem;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:6px}
.tool svg{width:22px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:8px 10px}
.controls select{font:inherit;font-size:.85rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.screen{background:var(--screen);border-radius:12px;overflow:hidden;position:relative}
#simCanvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.banner{position:absolute;left:10px;right:10px;top:10px;background:#5A1E14;color:#FFD9CF;border-radius:8px;padding:6px 10px;font-size:.82rem;z-index:2}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.caption{font-size:.88rem;margin:10px 0 0;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.panel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 16px}
.readout div small{display:block;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.readout div b{font-family:var(--f-mono);font-weight:500;font-size:1.02rem;font-variant-numeric:tabular-nums}
.graph{width:100%;height:110px;display:block;background:var(--screen);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--muted);margin-top:10px;align-items:center}
.vbar{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#4DABF7,#7C8B85,#FF6B4A);vertical-align:middle;margin:0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FFD43B;vertical-align:middle;margin-right:6px}
.valform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.valform input{font:inherit;font-family:var(--f-mono);width:8em;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.gl{font-family:var(--f-mono);font-size:.72rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.region{font-family:var(--f-mono);font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
@media (max-width:560px){.q{padding:16px 14px}.q .schem{margin-inline:-8px;padding:6px 4px}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Daily Bench</h1><span>EE fundamentals, one bench at a time</span></div>
    <nav class="tabs" aria-label="Views">
      <a href="#today" id="tabToday">Today</a>
      <a href="#sim" id="tabSim">Simulator</a>
    </nav>
  </header>

  <section id="viewToday">
    <div class="dayhead">
      <div><div class="eyebrow" id="dateLabel"></div><h2>Today's four questions</h2></div>
      <div class="stats">
        <div class="stat"><b id="statStreak">0</b><small>day streak</small></div>
        <div class="stat"><b id="statScore">0/4</b><small>today</small></div>
        <div class="stat"><b id="statAll">—</b><small>all-time</small></div>
      </div>
    </div>
    <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
    <div class="qlist" id="qlist"></div>
    <div id="doneBox"></div>
    <div id="practiceWrap" hidden>
      <div class="section-label eyebrow">Extra practice</div>
      <div class="qlist" id="practiceList"></div>
    </div>
  </section>

  <section id="viewSim" hidden>
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Parts"></div>
    <div class="controls">
      <select id="presetSel" aria-label="Example circuits"></select>
      <button class="btn small" id="runBtn">Pause</button>
      <button class="btn small ghost" id="restartBtn">Restart</button>
      <select id="speedSel" aria-label="Simulation speed">
        <option value="1">Real time</option><option value="0.25">¼ speed</option><option value="0.05">1/20 speed</option><option value="0.01">1/100 speed</option>
      </select>
      <button class="btn small ghost" id="voltsBtn" aria-pressed="false">Show node voltages</button>
      <button class="btn small ghost" id="clearBtn">Clear</button>
    </div>
    <div class="screen" id="screen">
      <canvas id="simCanvas"></canvas>
      <div class="banner" id="banner" hidden></div>
    </div>
    <p class="hint" id="hint"></p>
    <p class="caption" id="caption" hidden></p>
    <div class="panel" id="panel"></div>
    <div class="legend">
      <span>Wire color = voltage: <span class="vbar"></span> negative · 0 V · positive</span>
      <span><span class="dot"></span>Moving dots = conventional current (+ to −). Faster = more current.</span>
    </div>
  </section>
</div>
<script>
"use strict";
/* ---------------- storage ---------------- */
const STORE_KEY="dailybench.v1";
function loadStore(){let s=null;try{s=JSON.parse(localStorage.getItem(STORE_KEY)||"null");}catch(e){}
  s=s&&s.days?s:{days:{},missed:[],total:0,correct:0};s.sets=s.sets||{};s.review=s.review||{};s.missed=s.missed||[];return s;}
function saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}}
let store=loadStore();

/* ---------------- helpers ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);const t=new Date(y,m-1,d+n);return dateKey(t);}
const SI=[[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"],[1e-12,"p"]];
function fmtSI(x,unit){if(!isFinite(x))return "—";const ax=Math.abs(x);if(ax<1e-12)return "0 "+unit;
  for(const [m,p] of SI){if(ax>=m*0.9995){const v=x/m;const s=Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);return (s.includes(".")?s.replace(/\.?0+$/,""):s)+" "+p+unit;}}
  return (x/1e-12).toFixed(2)+" p"+unit;}
function parseSI(s){const m=String(s).trim().replace(",",".").match(/^([-+]?\d*\.?\d+(?:e[-+]?\d+)?)\s*([pnuµmkKMG]?)/);if(!m)return NaN;
  const mult={p:1e-12,n:1e-9,u:1e-6,"µ":1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,"":1}[m[2]];return parseFloat(m[1])*mult;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= SIMULATOR CORE =================
   Modified nodal analysis, solved every time step.
   Two-terminal parts run from point a to point b. Battery/AC/current source: a is −, b is +.
   Diodes: a is the anode. Three-terminal parts sit at an anchor point:
   op-amp a=in−, b=in+, c=out; NMOS a=gate, b=drain, c=source; NPN a=base, b=collector, c=emitter. */
const RW=1e-3, GMIN=1e-12, AG=1e5;
const DIODE={d:{Is:1e-14,n:1},sd:{Is:1e-8,n:1.05},led:{Is:1.5e-19,n:2},z:{Is:1e-14,n:1}};
const VT=0.025852;
const NAMES={w:"Wire",r:"Resistor",v:"Battery",a:"AC source",i:"Current source",c:"Capacitor",l:"Inductor",d:"Diode",sd:"Schottky diode",z:"Zener diode",led:"LED",s:"Switch",g:"Ground",op:"Op-amp",nmos:"N-channel MOSFET",npn:"NPN transistor"};
const UNITS={r:"Ω",v:"V",a:"V",i:"A",c:"F",l:"H",z:"V"};
const DEFAULTS={r:1000,v:5,a:5,i:0.01,c:100e-6,l:1,s:1,z:5.1};
const TRI={op:1,nmos:1,npn:1};
const DIODES={d:1,sd:1,led:1,z:1};
let uid=1;
function footprint(t,x,y){return t==="op"?[[x,y-1],[x,y+1],[x+3,y]]:[[x,y],[x+2,y-1],[x+2,y+1]];}
function mkEl(t,x1,y1,x2,y2,v,extra){
  const e={id:uid++,t,I:0,V:0,phase:0,ph:[0,0,0],vPrev:0,iPrev:0,vdLin:0};
  if(TRI[t]){const fp=footprint(t,x1,y1);e.o=[x1,y1];e.a=fp[0];e.b=fp[1];e.c=fp[2];
    if(t==="op"){e.lo=y2!=null&&typeof x2==="number"?x2:-12;e.hi=typeof y2==="number"?y2:12;e.sat=0;}
    if(t==="nmos"){e.vth=2;e.k=2.5;e.lvgs=0;e.lvds=0;e.vgsPrev=0;}
    if(t==="npn"){e.lvbe=0;e.lvbc=0;}
    if(typeof v==="string")e.lab=v;
    return e;}
  e.a=[x1,y1];e.b=t==="g"?[x1,y1]:[x2,y2];e.v=v!=null?v:DEFAULTS[t];
  if(t==="a")e.f=(typeof extra==="number")?extra:1;else if(typeof extra==="string")e.lab=extra;
  if(t==="a"&&typeof extra==="string")e.f=1;
  return e;}
// spec rows: [type,x1,y1,x2,y2,value,extra]; ["g",x,y]; ["op",x,y,lo,hi]; ["nmos",x,y,label]
function fromSpec(spec){return spec.map(s=>{
  if(s[0]==="g")return mkEl("g",s[1],s[2]);
  if(s[0]==="op")return mkEl("op",s[1],s[2],s[3],s[4]);
  if(TRI[s[0]])return mkEl(s[0],s[1],s[2],null,null,s[3]);
  const e=mkEl(s[0],s[1],s[2],s[3],s[4],s[5],s[6]);if(s[0]==="a"&&typeof s[7]==="string")e.lab=s[7];return e;});}
const key=p=>p[0]+","+p[1];
function terms(e){return e.t==="g"?[e.a]:TRI[e.t]?[e.a,e.b,e.c]:[e.a,e.b];}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
// split any wire that passes over another part's terminal, so they connect
function normalize(els){
  let changed=true,guard=0;
  while(changed&&guard++<80){changed=false;
    const tset=new Set();for(const e of els)for(const p of terms(e))tset.add(key(p));
    for(let i=0;i<els.length;i++){const e=els[i];if(e.t!=="w")continue;
      const dx=e.b[0]-e.a[0],dy=e.b[1]-e.a[1],g=gcd(dx,dy);if(g<2)continue;
      for(let k=1;k<g;k++){const p=[e.a[0]+dx/g*k,e.a[1]+dy/g*k];
        if(tset.has(key(p))){const w2=mkEl("w",p[0],p[1],e.b[0],e.b[1]);e.b=p;els.push(w2);changed=true;break;}}
      if(changed)break;}}
  const seen=new Set();

const PC={bg:"#0E1A16",axis:"#476157",grid:"rgba(200,230,215,0.08)",text:"#9FBCAF",y:"#FFD43B",o:"#FF8A65",g:"#7FD6AC",b:"#6CB8F7"};
function frame(ctx,w,h,o){
  const L=50,R=14,T=14,B=34,pw=w-L-R,ph=h-T-B;
  const lx=v=>Math.log10(v),fx=o.log?v=>(lx(v)-lx(o.x0))/(lx(o.x1)-lx(o.x0)):v=>(v-o.x0)/(o.x1-o.x0);
  const X=v=>L+fx(v)*pw,Y=v=>T+(1-(v-o.y0)/(o.y1-o.y0))*ph;
  ctx.fillStyle=PC.bg;ctx.fillRect(0,0,w,h);ctx.font="500 10.5px 'IBM Plex Mono', ui-monospace, monospace";ctx.lineWidth=1;
  ctx.textBaseline="middle";
  for(const [v,l] of o.xt||[]){ctx.strokeStyle=PC.grid;ctx.beginPath();ctx.moveTo(X(v),T);ctx.lineTo(X(v),T+ph);ctx.stroke();ctx.fillStyle=PC.text;ctx.textAlign="center";ctx.fillText(l,X(v),T+ph+11);}
  for(const [v,l] of o.yt||[]){ctx.strokeStyle=PC.grid;ctx.beginPath();ctx.moveTo(L,Y(v));ctx.lineTo(L+pw,Y(v));ctx.stroke();ctx.fillStyle=PC.text;ctx.textAlign="right";ctx.fillText(l,L-6,Y(v));}
  ctx.strokeStyle=PC.axis;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+ph);ctx.lineTo(L+pw,T+ph);ctx.stroke();
  ctx.fillStyle=PC.text;ctx.textAlign="center";if(o.xl)ctx.fillText(o.xl,L+pw/2,h-8);
  if(o.yl){ctx.save();ctx.translate(11,T+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(o.yl,0,0);ctx.restore();}
  ctx.save();ctx.beginPath();ctx.rect(L,T-2,pw,ph+4);ctx.clip();
  return {X,Y,L,T,pw,ph,done:()=>ctx.restore()};}
function crv(ctx,F,f,x0,x1,col,o){o=o||{};ctx.strokeStyle=col;ctx.lineWidth=o.w||2;ctx.setLineDash(o.dash||[]);ctx.beginPath();const n=o.n||240;
  for(let i=0;i<=n;i++){const x=o.log?Math.pow(10,Math.log10(x0)+(Math.log10(x1)-Math.log10(x0))*i/n):x0+(x1-x0)*i/n;const y=f(x);const px=F.X(x),py=F.Y(y);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();ctx.setLineDash([]);}
function vline(ctx,F,x,col,lab,yfrac){ctx.strokeStyle=col;ctx.setLineDash([4,4]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(F.X(x),F.T);ctx.lineTo(F.X(x),F.T+F.ph);ctx.stroke();ctx.setLineDash([]);
  if(lab){ctx.fillStyle=col;ctx.textAlign="left";ctx.fillText(lab,F.X(x)+4,F.T+F.ph*(yfrac==null?0.1:yfrac));}}
function hline(ctx,F,y,col,lab,xfrac,align){ctx.strokeStyle=col;ctx.setLineDash([4,4]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(F.L,F.Y(y));ctx.lineTo(F.L+F.pw,F.Y(y));ctx.stroke();ctx.setLineDash([]);
  if(lab){ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.fillText(lab,F.L+F.pw*(xfrac==null?0.02:xfrac),F.Y(y)-8);}}
function dot(ctx,F,x,y,col,lab,dx,dy){ctx.fillStyle=col;ctx.beginPath();ctx.arc(F.X(x),F.Y(y),3.5,0,7);ctx.fill();if(lab){ctx.textAlign=dx<0?"right":"left";ctx.fillText(lab,F.X(x)+(dx||6),F.Y(y)+(dy||-9));}}
function txt(ctx,F,x,y,col,s,align){ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.fillText(s,F.X(x),F.Y(y));}

    const F=frame(ctx,w,h,{x0:2,x1:10,y0:0,y1:1,xl:"V_GS (V)",yl:"R_DS(on) (Ω)",xt:[2,3.3,4.5,6,8,10].map(v=>[v,String(v)]),yt:[[0.05,"0.05"],[0.31,"0.31"],[1,"1"]]});
    crv(ctx,F,v=>1/(2.5*Math.max(v-2,0.01)),2.1,10,PC.y);dot(ctx,F,3.3,0.308,PC.o,"3.3 V gate: 0.31 Ω",8,-10);dot(ctx,F,10,0.05,PC.g,"10 V gate: 0.05 Ω",-6,-12);F.done();}},
  gbw:{h:190,draw(ctx,w,h,st){const F=frame(ctx,w,h,{log:1,x0:1,x1:1e7,y0:0,y1:110,xl:"frequency (Hz)",yl:"gain (dB)",
      xt:[[1,"1"],[100,"100"],[1e4,"10k"],[1e6,"1M"],[1e7,"10M"]],yt:[[0,"0 (×1)"],[40,"40 (×100)"],[100,"100"]]});
    crv(ctx,F,f=>Math.max(0,20*Math.log10(1e5/Math.sqrt(1+(f/10)**2))),1,1e7,PC.y,{log:1});txt(ctx,F,30,96,PC.y,"open-loop gain falls ×10 per decade");
    if(st>=2){ctx.strokeStyle=PC.o;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(F.X(1),F.Y(40));ctx.lineTo(F.X(1e4),F.Y(40));ctx.stroke();
      dot(ctx,F,1e4,40,PC.o,"gain 100 runs out at 10 kHz",8,-10);vline(ctx,F,1e6,PC.g,"GBW 1 MHz",0.55);}
    F.done();}},
  buck:{h:180,draw(ctx,w,h,st){const F=frame(ctx,w,h,{x0:0,x1:4,y0:0,y1:14,xl:"switching periods",yl:"volts",xt:[0,1,2,3,4].map(v=>[v,String(v)]),yt:[[0,"0"],[3.3,"3.3"],[12,"12"]]});
    crv(ctx,F,t=>(t%1)<0.275?12:0,0,4,PC.y,{n:1600});txt(ctx,F,0.3,13,PC.y,"switch node: 12 V for 27.5% of each period");
    if(st>=2){hline(ctx,F,3.3,PC.g,"average = 12 V × 27.5% = 3.3 V (what the LC filter keeps)",0.08);}
    F.done();}},
  ripple:{h:180,draw(ctx,w,h,st){const F=frame(ctx,w,h,{x0:0,x1:2,y0:0,y1:1.25,xl:"input cycles",yl:"output",xt:[[0,"0"],[0.5,"½"],[1,"1"],[1.5,"1½"],[2,"2"]],yt:[[0,"0"],[1,"peak"]]});
    crv(ctx,F,t=>Math.max(0,Math.sin(2*Math.PI*t)),0,2,PC.o,{dash:[5,4]});crv(ctx,F,t=>Math.abs(Math.sin(2*Math.PI*t)),0,2,PC.y);
    txt(ctx,F,0.02,1.15,PC.y,"full-wave: 2 bumps per cycle (120 Hz)");txt(ctx,F,1.02,1.15,PC.o,"half-wave: 1 per cycle (60 Hz)");F.done();}},
  fourTwenty:{h:180,draw(ctx,w,h,st){const F=frame(ctx,w,h,{x0:0,x1:100,y0:0,y1:22,xl:"measured value (% of range)",yl:"loop current (mA)",xt:[0,25,50,75,100].map(v=>[v,v+"%"]),yt:[[0,"0"],[4,"4"],[12,"12"],[20,"20"]]});
    ctx.fillStyle="rgba(240,138,114,0.14)";ctx.fillRect(F.L,F.Y(3.6),F.pw,F.Y(0)-F.Y(3.6));txt(ctx,F,40,1.8,PC.o,"below ~3.6 mA = fault (wire broken)");
    crv(ctx,F,p=>4+0.16*p,0,100,PC.y);dot(ctx,F,50,12,PC.g,"12 mA = 50%",8,-10);F.done();}}

function drawPlot(canvas,id,stage){const P=PLOTS[id];const w=canvas.clientWidth||320,h=P.h,dpr=window.devicePixelRatio||1;

{id:"f8",cat:"Fundamentals",lvl:2,type:"mc",circ:"quarter",q:"What's the most voltage you can put across a 1 kΩ, ¼ W resistor without exceeding its power rating?",

{id:"f10",cat:"Fundamentals",lvl:2,type:"mc",circ:"dividerLoad",q:"You connect a 5 kΩ load across the bottom resistor of this divider. What happens to the midpoint voltage?",

  S("So the ideal voltmeter has infinite resistance (draws nothing) and the ideal ammeter has zero (drops nothing). Real ones come close: about 10 MΩ and 0.1 Ω.")],

{id:"f12",cat:"Fundamentals",lvl:2,type:"mc",circ:"thevenin",q:"Thévenin's theorem lets you replace any linear two-terminal network with:",
 ch:["A voltage source in series with one resistor","A current source in series with one resistor","A single resistor","A voltage source in parallel with a resistor"],a:0,

{id:"f13",cat:"Fundamentals",lvl:2,type:"num",circ:"thevenin",q:"What is the Thévenin resistance at the midpoint of a divider made of two 10 kΩ resistors fed by an ideal voltage source?",ans:5000,unit:"Ω",

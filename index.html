/* ================= INSPECTOR ================= */
class Inspector{
  constructor(el,view,opt){this.el=el;this.view=view;this.compact=!!(opt&&opt.compact);this.hist=[];view.inspector=this;this.render();}
  render(){const v=this.view,e=v.sel,k=v.selNode;this.hist=[];this.rowsEl=null;this.gc=null;
    if(!e&&!k){this.el.innerHTML=this.compact?`<div class="lab-read">Tap any part to read it. Tap a switch to flip it.</div>`:
      `<div class="eyebrow">Inspector</div><div>Tap any part to see the voltage across it, the current through it and its power, plus a live trace. Pick an example above to start, or build your own: a battery, a resistor and two wires make a complete loop.</div>`;return;}
    let h="";
    if(k){h=this.compact?`<div class="lab-read"><b>Junction</b><span data-r></span></div>`:`<div class="eyebrow">Junction</div><div class="readout" data-r></div>`;}
    else{const hasVal=e.t in UNITS||e.t==="op";
      const btns=[];if(e.t==="s")btns.push(`<button class="${this.compact?"screen-btn":"btn small"}" data-act="toggle">${e.v?"Open":"Close"} switch</button>`);
      if(e.t==="v"||e.t==="a"||e.t==="i"||DIODES[e.t])btns.push(`<button class="${this.compact?"screen-btn":"btn small ghost"}" data-act="flip">Flip</button>`);
      if(e.t==="op")btns.push(`<button class="${this.compact?"screen-btn":"btn small ghost"}" data-act="flip">Swap inputs</button>`);
      btns.push(`<button class="${this.compact?"screen-btn":"btn small ghost"}" data-act="del">Delete</button>`);
      let form="";
      if(hasVal){const val=e.t==="op"?`${e.lo}, ${e.hi}`:fmtSI(e.v,"").trim();
        form=`<form class="valform" data-form><label>${e.t==="a"?"Amplitude":e.t==="op"?"Rails":"Value"}</label><input data-val value="${val}" autocomplete="off" aria-label="Value"><span class="unit">${e.t==="op"?"V":UNITS[e.t]}</span>`+
          (e.t==="a"?`<label>Freq</label><input data-freq value="${fmtSI(e.f,"").trim()}" aria-label="Frequency"><span class="unit">Hz</span>`:"")+
          `<button class="${this.compact?"screen-btn":"btn small"}">Set</button></form>`;}
      if(this.compact)h=`<div class="lab-read"><b>${partName(e)}</b><span data-r style="display:contents"></span></div><div class="lab-ctl">${form}<span class="grow"></span>${btns.join("")}</div>`;
      else h=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Selected</div><h2>${partName(e)}</h2></div><div class="row">${btns.join("")}</div></div>${form}<div class="readout" data-r></div>`;}
    const lbl=k?"node voltage":TRI[e.t]?(e.t==="op"?"output voltage":e.t==="nmos"?"V_DS":"V_CE"):"voltage across";
    const ilbl=e&&TRI[e.t]?(e.t==="op"?"output current":e.t==="nmos"?"I_D":"I_C"):"current";

    this.el.innerHTML=h;this.rowsEl=this.el.querySelector("[data-r]");this.gc=this.el.querySelector("[data-g]");this.scaleEl=this.el.querySelector("[data-scale]");
    this.el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="toggle"){e.v=e.v?0:1;this.render();}else if(a==="flip"){v.flip(e);this.render();}else if(a==="del")v.remove(e);});
    const f=this.el.querySelector("[data-form]");if(f)f.onsubmit=ev=>{ev.preventDefault();const raw=f.querySelector("[data-val]").value;
      if(e.t==="op"){const p=raw.split(/[,\s]+/).map(parseFloat).filter(isFinite);if(p.length===2&&p[0]<p[1]){e.lo=p[0];e.hi=p[1];}}

    this.tick();}
  tick(){const v=this.view;if(!this.rowsEl)return;let pair;
    if(v.selNode){const x=v.ckt.nodeV(v.selNode);this.rowsEl.innerHTML=this.compact?`<span>${fmtSI(x,"V")} to ground</span>`:`<div><small>Voltage to ground</small><b>${fmtSI(x,"V")}</b></div>`;pair=[x,0];}

      if(e.t==="op")pair=[e.vo,e.Iout];else if(e.t==="nmos")pair=[e.vds,e.I];else if(e.t==="npn")pair=[e.vce,e.ic];else pair=[(e.t==="v"||e.t==="a"||e.t==="i")?-e.V:e.V,e.I];}

    const g=gc.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle=COL.bg;g.fillRect(0,0,w,hh);
    g.strokeStyle="rgba(200,230,215,0.12)";g.lineWidth=1;g.beginPath();g.moveTo(0,hh/2);g.lineTo(w,hh/2);g.stroke();
    const H=this.hist,mv=Math.max(1e-9,...H.map(p=>Math.abs(p[0]))),mi=Math.max(1e-12,...H.map(p=>Math.abs(p[1])));
    const plot=(i,m,c)=>{g.strokeStyle=c;g.lineWidth=1.8;g.beginPath();H.forEach((p,j)=>{const x=w-(H.length-1-j)*(w/300),y=hh/2-(p[i]/m)*(hh/2-8);j?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();};
    plot(0,mv,"#FF8A65");if(!v.selNode)plot(1,mi,"#FFD43B");

}

  b.innerHTML=`<svg viewBox="0 0 22 14" aria-hidden="true">${icon}</svg>${label}`;b.onclick=()=>setTool(id);tb.appendChild(b);}
function setTool(id){tool=id;for(const b of tb.children)b.setAttribute("aria-pressed",b.dataset.tool===id);
  const h=document.getElementById("hint");
  if(id==="select")h.textContent="Tap a part to read its voltage and current. Tap a switch to flip it. Tap a junction to read its voltage.";
  else if(id==="erase")h.textContent="Tap a part to remove it.";
  else if(id==="g")h.textContent="Tap a dot to put ground (0 V reference) there.";
  else if(TRI[id])h.textContent=`Tap a dot to place a ${NAMES[id].toLowerCase()}. ${id==="op"?"Its inputs land one dot above and below; the output is three dots right.":"Base/gate is the dot you tap; the other two pins are two dots right, one up and one down."}`;
  else h.textContent=`Drag from one grid dot to another to place a ${NAMES[id].toLowerCase()}. Ends that land on the same dot are connected.`;}
const presetSel=document.getElementById("presetSel");
{const groups={};for(const [k,c] of Object.entries(CIRCUITS)){const g=c.g||"Start";(groups[g]=groups[g]||[]).push([k,c]);}
  for(const [g,list] of Object.entries(groups)){const og=document.createElement("optgroup");og.label=g||"Start";for(const [k,c] of list){const o=document.createElement("option");o.value=k;o.textContent=c.name;og.appendChild(o);}presetSel.appendChild(og);}}
presetSel.onchange=()=>loadMain(presetSel.value);
function loadMain(k){const c=CIRCUITS[k];presetSel.value=k;mainView.load(k);mainView.select(c.sel!=null?mainView.el(c.sel):null);
  const sp=document.getElementById("speedSel");const s=String(c.speed||1);if([...sp.options].some(o=>o.value===s))sp.value=s;mainView.speed=c.speed||1;
  const cap=document.getElementById("caption");cap.hidden=!c.caption;cap.textContent=c.caption||"";}
document.getElementById("runBtn").onclick=e=>{mainView.running=!mainView.running;e.target.textContent=mainView.running?"Pause":"Run";};
document.getElementById("restartBtn").onclick=()=>mainView.restart();
document.getElementById("speedSel").onchange=e=>{mainView.speed=parseFloat(e.target.value);};
document.getElementById("voltsBtn").onclick=e=>{mainView.showV=!mainView.showV;e.target.setAttribute("aria-pressed",mainView.showV);e.target.textContent=mainView.showV?"Hide node voltages":"Show node voltages";};
document.getElementById("clearBtn").onclick=()=>loadMain("blank");

/* ================= QUIZ ================= */
const DAILY=4;
const ORDER=shuffle(BANK.map(q=>q.id),mulberry32(20261122));
const TODAY=dateKey(new Date());
function dayIndex(){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(2026,0,1);return Math.round((a-b)/86400000);}
function todaysIds(){
  if(store.sets[TODAY])return store.sets[TODAY].filter(id=>BANK_BY_ID[id]);
  const done=Object.keys(store.days[TODAY]||{}).filter(id=>BANK_BY_ID[id]);
  const seen=new Set();for(const d of Object.values(store.days))for(const id of Object.keys(d))seen.add(id);
  let pool=ORDER.filter(id=>!seen.has(id));
  if(pool.length<DAILY){const r=dayIndex()*DAILY%ORDER.length;pool=pool.concat(ORDER.slice(r),ORDER.slice(0,r)).filter((x,i,a)=>a.indexOf(x)===i);}
  const picks=done.slice(0,DAILY);
  if(picks.length===0){const tap=pool.find(id=>BANK_BY_ID[id].type==="tap");if(tap)picks.push(tap);}
  const due=Object.entries(store.review).filter(([id,k])=>k<=TODAY&&BANK_BY_ID[id]&&!picks.includes(id)).map(([id])=>id);
  const want=DAILY-(due.length&&picks.length<DAILY?1:0);
  for(const id of pool){if(picks.length>=want)break;if(!picks.includes(id)&&BANK_BY_ID[id].type!=="tap")picks.push(id);}
  for(const id of pool){if(picks.length>=want)break;if(!picks.includes(id))picks.push(id);}
  if(picks.length<DAILY&&due.length)picks.push(due[0]);
  if(picks.length>1&&BANK_BY_ID[picks[0]].type==="tap"&&!done.length)picks.splice(1,0,picks.shift());
  store.sets[TODAY]=picks;saveStore();return picks;}
function streak(){let s=0;const d=new Date();const ok=k=>store.days[k]&&Object.keys(store.days[k]).length>=DAILY;
  if(!ok(dateKey(d)))d.setDate(d.getDate()-1);while(ok(dateKey(d))){s++;d.setDate(d.getDate()-1);}return s;}
function refreshStats(){const rec=store.days[TODAY]||{},ids=todaysIds();
  document.getElementById("statStreak").textContent=streak();
  document.getElementById("statScore").textContent=ids.filter(i=>rec[i]&&rec[i].ok).length+"/"+DAILY;
  document.getElementById("statAll").textContent=store.total?Math.round(100*store.correct/store.total)+"%":"—";
  const m=document.getElementById("meter").children;for(let i=0;i<DAILY;i++){const id=ids[i];m[i].className=id&&rec[id]?(rec[id].ok?"ok":"bad"):"";}
  renderDone();}
function record(q,ok,given,isDaily){
  if(isDaily){const rec=store.days[TODAY]||(store.days[TODAY]={});if(rec[q.id])return;rec[q.id]={ok,given};}
  store.total++;if(ok)store.correct++;
  store.missed=store.missed.filter(i=>i!==q.id);if(!ok)store.missed.push(q.id);
  if(!ok)store.review[q.id]=addDays(TODAY,2);else if(store.review[q.id]&&store.review[q.id]<=TODAY)delete store.review[q.id];
  saveStore();refreshStats();}
function choiceOrder(q){return shuffle(q.ch.map((_,i)=>i),mulberry32(hashStr(q.id)));}

async function applyOps(view,ops){for(const op of ops){
  if(op[0]==="wait"){await sleep(op[1]*1000);continue;}
  if(op[0]==="del"){view.remove(view.el(op[1]));continue;}
  if(op[0]==="flip"){view.flip(view.el(op[1]));continue;}
  if(op[0]==="sel"){const e=view.el(op[1]);if(e)view.select(e);continue;}
  if(op[0]==="restart"){view.restart();continue;}
  const e=view.el(op[0]);if(!e)continue;e[op[1]]=op[2];view.dirty=true;}
  if(view.inspector)view.inspector.render();}

function buildLab(q,fig,view){
  const ctl=document.createElement("div");ctl.className="lab-ctl";
  ctl.innerHTML=`<button class="screen-btn" data-a="restart">Restart</button><button class="screen-btn" data-a="reset">Reset circuit</button><button class="screen-btn" data-a="volts" aria-pressed="false">Node voltages</button><button class="screen-btn" data-a="amps" aria-pressed="false">Currents</button><span class="grow"></span><button class="screen-btn" data-a="open">Open in Simulator tab</button>`;
  const ins=document.createElement("div");fig.appendChild(ins);fig.appendChild(ctl);
  new Inspector(ins,view,{compact:true});
  const vb=ctl.querySelector('[data-a="volts"]');
  ctl.onclick=ev=>{const a=ev.target.dataset&&ev.target.dataset.a;if(!a)return;
    if(a==="restart")view.restart();
    if(a==="reset"){view.load(q.circ);view.inspector.render();}
    if(a==="volts"){view.showV=!view.showV;vb.setAttribute("aria-pressed",view.showV);}
    if(a==="amps"){view.showI=!view.showI;ev.target.setAttribute("aria-pressed",view.showI);view.dirty=true;}
    if(a==="open"){loadMain(q.circ);location.hash="sim";}};
  view.syncVolts=()=>vb.setAttribute("aria-pressed",view.showV);}

function buildWalk(q,view,plotCv){
  const box=document.createElement("div");box.className="walk";let i=0;const N=q.steps.length;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><h4>Walk me through it</h4><span class="stepnum"></span></div><p class="steptext"></p><div class="nav"><button class="btn small ghost" data-b>Back</button><button class="btn small" data-n>Next</button><div class="dots">${q.steps.map(()=>"<i></i>").join("")}</div></div>`;
  const tx=box.querySelector(".steptext"),num=box.querySelector(".stepnum"),bb=box.querySelector("[data-b]"),nb=box.querySelector("[data-n]"),dots=box.querySelectorAll(".dots i");
  let stage=(q.steps[0]&&q.steps[0].p)||9;
  const show=()=>{const s=q.steps[i];tx.textContent=s.t;num.textContent=`Step ${i+1} of ${N}`;bb.disabled=i===0;nb.textContent=i===N-1?"Start over":"Next";
    dots.forEach((d,j)=>d.classList.toggle("on",j<=i));
    if(view){view.hl=new Set((s.hl||[]).map(k=>view.el(k)).filter(Boolean));view.showV=!!s.v;if(view.syncVolts)view.syncVolts();if(s.sel!=null){const e=view.el(s.sel);if(e)view.select(e);}view.dirty=true;}
    if(plotCv&&q.plot){if(s.p)stage=s.p;drawPlot(plotCv,q.plot,stage);plotCv.dataset.stage=stage;}};
  bb.onclick=()=>{if(i>0){i--;show();}};nb.onclick=()=>{i=i===N-1?0:i+1;show();};
  show();return box;}

function buildTry(q,view){
  const box=document.createElement("div");box.className="tryit";let i=0;
  const render=()=>{const t=q.try[i];box.innerHTML=`<div class="row" style="justify-content:space-between"><h4>Predict, then test${q.try.length>1?` (${i+1} of ${q.try.length})`:""}</h4></div><p class="ask">${t.ask}</p><div class="opts"></div>`;
    const opts=box.querySelector(".opts");
    t.ch.forEach((c,ci)=>{const b=document.createElement("button");b.textContent=c;b.onclick=async()=>{
      opts.querySelectorAll("button").forEach(x=>{x.disabled=true;});b.classList.add(ci===t.a?"right":"wrong");if(ci!==t.a)opts.children[t.a].classList.add("right");
      const th=document.createElement("p");th.className="then";th.innerHTML=`<b>${ci===t.a?"Good prediction.":"Watch what actually happens."}</b> Applying the change in the circuit above…`;box.appendChild(th);
      await applyOps(view,t.set);
      th.innerHTML=`<b>${ci===t.a?"Good prediction.":"Not what you predicted."}</b> ${t.then}`;
      if(i<q.try.length-1){const nx=document.createElement("button");nx.className="btn small";nx.textContent="Next experiment";nx.onclick=()=>{i++;render();};box.appendChild(nx);}
      else{const rs=document.createElement("button");rs.className="btn small ghost";rs.textContent="Reset circuit and try again";rs.onclick=()=>{view.load(q.circ);view.inspector.render();i=0;render();};box.appendChild(rs);}
      view.cv.scrollIntoView({behavior:"smooth",block:"nearest"});};opts.appendChild(b);});};
  render();return box;}

function describePick(view,given){
  if(given&&given.startsWith("n:")){const k=given.slice(2);return `That junction is at ${fmtSI(view.ckt.nodeV(k),"V")}.`;}
  const e=view.el(parseInt(given.slice(2)));if(!e)return "";
  if(TRI[e.t])return `You tapped the ${partName(e)}: ${region(e)}.`;
  if(e.t==="w")return "You tapped a wire. Wires drop (almost) no voltage: every point on one wire is the same node.";
  return `You tapped the ${partName(e)}: ${fmtSI(Math.abs(e.V),"V")} across it, ${fmtSI(Math.abs(e.I),"A")} through it.`;}

function card(q,opts){
  const el=document.createElement("article");el.className="q";el.dataset.qid=q.id;
  const lvl="●".repeat(q.lvl)+"○".repeat(3-q.lvl);
  el.innerHTML=`<div class="q-meta"><span class="chip${q.type==="tap"?" tap":""}">${q.cat}</span>${opts.review?'<span class="chip rev">Review</span>':""}<span class="lvl" title="Difficulty">${lvl}</span><span class="qn">${opts.n?opts.n+" / "+opts.total:"practice"}</span></div><h3 class="q-text">${q.q}</h3>`;
  let fig=null,view=null;
  if(q.circ){fig=document.createElement("figure");fig.className="schem"+(q.type==="tap"?" tapmode":"");
    const cv=document.createElement("canvas");const ban=document.createElement("div");ban.className="banner";ban.hidden=true;fig.appendChild(cv);fig.appendChild(ban);el.appendChild(fig);
    view=new SimView(cv,{mode:"embed",live:false,interact:q.type==="tap"?"pick":"none",banner:ban});view.pickMode=q.mode;requestAnimationFrame(()=>view.load(q.circ));}
  const prior=opts.isDaily?(store.days[TODAY]||{})[q.id]:null;
  const ansBox=document.createElement("div");el.appendChild(ansBox);
  const res=document.createElement("div");res.className="result";res.hidden=true;
  let hintBtn=null,answered=false;
  const finish=(ok,given,givenText)=>{if(answered)return;answered=true;if(hintBtn)hintBtn.remove();record(q,ok,given,opts.isDaily);reveal(ok,given,givenText,true);};
  const reveal=(ok,given,givenText,fresh)=>{answered=true;res.hidden=false;res.innerHTML="";
    const v=document.createElement("div");v.className="verdict"+(ok?"":" no");
    const correct=q.type==="mc"?q.ch[q.a]:q.type==="num"?(q.ans+" "+q.unit):"";
    let why="";
    if(!ok&&q.type==="mc"&&q.why&&q.why[given])why=`<p class="whynot"><b>Why not "${q.ch[given]}":</b> ${q.why[given]}</p>`;
    if(!ok&&q.type==="num"&&givenText)why=`<p class="key">You answered ${givenText}.</p>`;
    v.innerHTML=`<strong>${ok?"Correct.":q.type==="tap"?"Not that one.":"Not quite. The answer is "+correct+"."}</strong>${why}<p>${q.ex}</p>`;
    res.appendChild(v);
    let plotCv=null;
    if(q.plot){const pw=document.createElement("div");pw.className="plotwrap";plotCv=document.createElement("canvas");pw.appendChild(plotCv);res.appendChild(pw);}
    if(fig){res.appendChild(fig);fig.classList.remove("tapmode");view.interact="inspect";
      if(q.type==="tap"){view.ckt.run(q.at||0.05);const tp=document.createElement("p");tp.className="key";tp.style.color="#BFD6CB";tp.textContent=describePick(view,given);fig.insertBefore(tp,fig.firstChild);
        view.hl=new Set((q.ans||[]).map(i=>typeof i==="number"?view.el(i):null).filter(Boolean));}
      view.live=true;view.sel=null;view.selNode=null;buildLab(q,fig,view);requestAnimationFrame(()=>{view.resize();});}
    if(q.steps&&q.steps.length)res.appendChild(buildWalk(q,view,plotCv));
    else if(plotCv)requestAnimationFrame(()=>drawPlot(plotCv,q.plot,9));
    if(q.try&&view)res.appendChild(buildTry(q,view));
    const k=document.createElement("p");k.className="key";k.textContent="Key idea: "+q.key;res.appendChild(k);
    if(ok){const g=document.createElement("button");g.className="btn link guess";const queued=store.review[q.id]&&store.review[q.id]>TODAY;
      g.textContent=queued?"Queued for review in 2 days":"Got it right but guessed? Bring this back in 2 days";g.disabled=!!queued;
      g.onclick=()=>{store.review[q.id]=addDays(TODAY,2);saveStore();g.textContent="Queued for review in 2 days";g.disabled=true;};res.appendChild(g);}
    if(fresh)requestAnimationFrame(()=>res.scrollIntoView({behavior:"smooth",block:"nearest"}));};
  if(q.type==="mc"){const box=document.createElement("div");box.className="choices";const ord=choiceOrder(q);
    const mark=given=>{for(const b of box.children){b.disabled=true;const ci=+b.dataset.ci;if(ci===q.a)b.classList.add("right");else if(ci===given)b.classList.add("wrong");}};
    ord.forEach((ci,pos)=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<span class="k">${"ABCD"[pos]}</span><span>${q.ch[ci]}</span>`;b.dataset.ci=ci;
      b.onclick=()=>{mark(ci);finish(ci===q.a,ci);};box.appendChild(b);});
    ansBox.appendChild(box);if(prior)mark(prior.given);}
  else if(q.type==="num"){const f=document.createElement("form");f.className="numform";const iid="in-"+q.id+"-"+(opts.isDaily?"d":Math.random().toString(36).slice(2,7));
    f.innerHTML=`<label class="eyebrow" for="${iid}" style="width:100%">Your answer</label><input id="${iid}" inputmode="decimal" autocomplete="off" placeholder="0"><span class="unit">${q.unit}</span><button class="btn">Check</button>`;
    const inp=f.querySelector("input"),btn=f.querySelector("button");
    f.onsubmit=ev=>{ev.preventDefault();const x=parseFloat(inp.value.replace(",","."));if(!isFinite(x)){inp.focus();return;}
      const tol=q.tol||0.02,ok=Math.abs(x-q.ans)<=Math.abs(q.ans)*tol+1e-9;inp.disabled=btn.disabled=true;finish(ok,x,x+" "+q.unit);};
    ansBox.appendChild(f);if(prior){inp.value=prior.given;inp.disabled=btn.disabled=true;}}
  else{const bar=document.createElement("div");bar.className="tapbar";bar.innerHTML=`<span class="picked">Tap ${q.mode==="node"?"a junction":"a part"} in the schematic above.</span><span style="flex:1"></span><button class="btn" disabled>Check</button>`;
    const pk=bar.querySelector(".picked"),btn=bar.querySelector("button");
    view.onPick=()=>{const s=view.selNode?"junction selected":view.sel?"selected: "+NAMES[view.sel.t].toLowerCase():"";pk.textContent=s?s[0].toUpperCase()+s.slice(1):"Tap a part in the schematic above.";btn.disabled=!(view.sel||view.selNode);};
    btn.onclick=()=>{let ok=false,given;
      if(view.selNode){given="n:"+view.selNode;ok=(q.ans||[]).some(a=>typeof a==="string"&&wireGroup(view.ckt.els,a).has(view.selNode));}
      else if(view.sel){const i=view.idxOf(view.sel);given="e:"+i;ok=(q.ans||[]).includes(i);}
      btn.disabled=true;view.interact="none";finish(ok,given);};
    ansBox.appendChild(bar);
    if(prior){btn.disabled=true;view.interact="none";}}
  if(q.steps&&q.steps.length&&!prior){hintBtn=document.createElement("button");hintBtn.className="btn link";hintBtn.textContent="Stuck? Show a hint instead of guessing";
    hintBtn.onclick=()=>{const h=document.createElement("div");h.className="hintbox";h.innerHTML=`<b>Hint:</b> ${q.steps[0].t}`;hintBtn.replaceWith(h);hintBtn=null;};el.appendChild(hintBtn);}
  el.appendChild(res);
  if(prior){const restore=()=>{reveal(prior.ok,prior.given,q.type==="num"?prior.given+" "+q.unit:"",false);};requestAnimationFrame(()=>requestAnimationFrame(restore));}
  return el;}

function renderToday(){
  const d=new Date();document.getElementById("dateLabel").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const list=document.getElementById("qlist");list.innerHTML="";const ids=todaysIds();
  ids.forEach((id,i)=>list.appendChild(card(BANK_BY_ID[id],{n:i+1,total:DAILY,isDaily:true,review:!!(store.review[id]&&store.review[id]<=TODAY&&Object.values(store.days).some(r=>r!==store.days[TODAY]&&r[id]))})));
  refreshStats();}
function renderDone(){const box=document.getElementById("doneBox");const rec=store.days[TODAY]||{},ids=todaysIds();const n=ids.filter(i=>rec[i]).length;
  if(n<DAILY){box.innerHTML="";return;}
  const score=ids.filter(i=>rec[i].ok).length;const missed=store.missed.length;
  box.innerHTML=`<div class="done" style="margin-top:16px"><h2>${score===DAILY?"Clean sweep.":score+" of "+DAILY+" today."} New questions tomorrow.</h2><div>Questions you miss (or mark as guessed) come back for review two days later. Keep going with extra questions, or play with today's circuits.</div><div class="row"><button class="btn" id="morebtn">Another question</button>${missed?`<button class="btn ghost" id="missbtn">Retry a missed one (${missed})</button>`:""}<a class="btn ghost" href="#sim">Open simulator</a></div></div>`;
  document.getElementById("morebtn").onclick=()=>addPractice(false);
  const mb=document.getElementById("missbtn");if(mb)mb.onclick=()=>addPractice(true);}
function addPractice(fromMissed){const wrap=document.getElementById("practiceWrap"),list=document.getElementById("practiceList");wrap.hidden=false;
  const shown=new Set([...todaysIds(),...[...list.querySelectorAll("[data-qid]")].map(e=>e.dataset.qid)]);
  let pool=fromMissed?store.missed.filter(i=>!shown.has(i)&&BANK_BY_ID[i]):BANK.map(q=>q.id).filter(i=>!shown.has(i));
  if(!pool.length)pool=fromMissed?store.missed.filter(i=>BANK_BY_ID[i]):BANK.map(q=>q.id);if(!pool.length)return;
  const id=pool[Math.floor(Math.random()*pool.length)];const c=card(BANK_BY_ID[id],{isDaily:false});list.appendChild(c);c.scrollIntoView({behavior:"smooth",block:"start"});}

/* ================= LOOP + ROUTING ================= */
let last=performance.now();
function frameLoop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(const v of VIEWS){if(!v.cv.isConnected&&v!==mainView){VIEWS.delete(v);continue;}if(!v.visible())continue;v.tick(dt);}
  requestAnimationFrame(frameLoop);}
function route(){const sim=location.hash==="#sim";document.getElementById("viewSim").hidden=!sim;document.getElementById("viewToday").hidden=sim;
  document.getElementById("tabSim").toggleAttribute("aria-current",sim);document.getElementById("tabToday").toggleAttribute("aria-current",!sim);
  document.getElementById(sim?"tabSim":"tabToday").setAttribute("aria-current","page");
  requestAnimationFrame(()=>{for(const v of VIEWS)if(v.cv.isConnected&&v.cv.clientWidth)v.resize();document.querySelectorAll(".plotwrap canvas").forEach(c=>{const q=c.closest(".q");if(q)drawPlot(c,BANK_BY_ID[q.dataset.qid].plot,+c.dataset.stage||9);});});}
window.addEventListener("hashchange",route);
let rzT=0;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{for(const v of VIEWS)if(v.cv.isConnected&&v.cv.clientWidth)v.resize();
  document.querySelectorAll(".plotwrap canvas").forEach(c=>{const q=c.closest(".q");if(q)drawPlot(c,BANK_BY_ID[q.dataset.qid].plot,+c.dataset.stage||9);});},120);});
setTool("select");
route();loadMain("led");renderToday();requestAnimationFrame(frameLoop);
</script>
